<title>Puzzle prototype (test)</title>
<style>:root {
  /* neutral dark background (mandate §8), the same in every version; the board itself stays light for contrast */
  --bg: #1e2226; --ink: #e8edf1; --muted: #a3aeb7; --card: #2b3137; --line: #434c54;
  --accent: #4d8dff; --accent-ink: #ffffff; --fire: #f06a1d; --warm: #ffcf3f; --cold: #6aa8ea; --bad: #ff8a4c;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { display: flex; justify-content: center; }
#app { width: 100%; max-width: 480px; min-height: 100%; display: flex; flex-direction: column; position: relative; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 4px; min-height: 44px; }
.badge { font-weight: 650; font-size: 17px; display: flex; align-items: center; gap: 6px; }
.badge .sym { font-size: 20px; line-height: 1; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--ink); }
.dots i.done { background: var(--muted); }
.hint { padding: 2px 14px 6px; min-height: 30px; color: var(--muted); font-size: 15px; }
.hint b { color: var(--ink); }
#stage { position: relative; display: flex; justify-content: center; }
canvas#board { touch-action: none; display: block; user-select: none; -webkit-user-select: none; }
.controls { display: flex; gap: 8px; padding: 8px 10px 14px; justify-content: center; flex-wrap: nowrap; }
.controls button { flex: 0 1 auto; min-width: 0; padding: 10px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls button.grow { flex: 1 1 0; }
@media (max-width: 380px) { .controls { gap: 6px; padding: 8px 8px 12px; } .controls button { padding: 10px 10px; font-size: 15px; } .controls button.strike { min-width: 84px; } }
button { font: inherit; border: 0; border-radius: 12px; min-height: 48px; padding: 10px 16px; cursor: pointer;
  background: var(--card); color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.25), inset 0 0 0 1px var(--line); }
button.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; font-weight: 650; }
button.strike { background: var(--fire); color: #fff; box-shadow: none; font-weight: 700; min-width: 108px; }
button:disabled { opacity: .45; cursor: default; }
button.hold.active { background: #4a3d16; box-shadow: inset 0 0 0 2px var(--warm); }
.grow { flex: 1; }
.sheet { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; padding: 18px 16px 28px; z-index: 5; }
.sheet h1 { font-size: 22px; margin: 6px 0 12px; }
.sheet h2 { font-size: 18px; margin: 18px 0 8px; }
.sheet p { margin: 8px 0; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; box-shadow: inset 0 0 0 1px var(--line); }
.likert { display: flex; gap: 6px; justify-content: space-between; margin-top: 8px; }
.likert button { min-height: 44px; min-width: 0; flex: 1; padding: 0; border-radius: 10px; }
.likert button.sel { background: var(--accent); color: #fff; box-shadow: none; }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 4px; }
textarea { width: 100%; min-height: 76px; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #22272c; color: var(--ink); resize: vertical; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; margin: 8px 0; padding: 14px; }
.choice .sym { font-size: 24px; width: 30px; text-align: center; }
.choice .rank { margin-left: auto; font-weight: 700; min-width: 24px; text-align: right; }
.choice.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.banner { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--card); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.45), inset 0 0 0 1px var(--line); z-index: 4; display: flex; flex-direction: column; gap: 10px; }
.banner .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.banner .msg { font-weight: 650; }
.err { color: var(--bad); font-size: 14px; min-height: 18px; }
.banner .card { margin: 0; padding: 8px 10px; }
.sheet.done h1 { font-size: 19px; margin: 2px 0 8px; }
.sheet.done h2 { font-size: 17px; margin: 10px 0 4px; }
.sheet.done p { margin: 4px 0; }
.sheet.done .card { padding: 10px 12px; margin: 6px 0; }
.sheet.done .choice { padding: 9px 12px; margin: 6px 0; }
.banner textarea { min-height: 52px; }
.banner .err:empty { display: none; }
.small { font-size: 13px; color: var(--muted); }
.ruleimg { display: block; margin: 6px auto 2px; }
.list button { width: 100%; text-align: left; margin: 6px 0; }
pre.rec { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #22272c; color: var(--ink); padding: 8px; border-radius: 8px; max-height: 260px; overflow: auto; }
.shake { animation: shake .3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
/* reduced motion: no shake (the reason still shows on the hint line) */
.reduce .shake { animation: none; }
/* neutral touch check: plain shapes only */
.warm p { margin: 4px 0 10px; }
.tapzone { display: flex; justify-content: center; padding: 18px 0; }
button.dot { width: 72px; height: 72px; min-height: 72px; border-radius: 50%; background: var(--accent); box-shadow: none; padding: 0; }
.pad { position: relative; height: 210px; border-radius: 12px; background: #22272c; touch-action: none; overflow: hidden; }
.pad .target { position: absolute; right: 18px; top: 60px; width: 92px; height: 92px; border: 3px dashed var(--muted); border-radius: 12px; }
.pad .token { position: absolute; left: 22px; top: 76px; width: 60px; height: 60px; border-radius: 10px; background: #9aa6b0; touch-action: none; }
.scrollbox { height: 170px; overflow-y: auto; touch-action: pan-y; border-radius: 12px; background: #22272c; padding: 6px 12px; }
.scrollbox .line { padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.scrollbox button { margin: 12px 0 6px; }
/* pairwise choices and the continuation question */
.row { display: flex; gap: 10px; }
.choice.half { flex: 1 1 0; margin: 6px 0 0; padding: 12px; justify-content: center; }
.pair { padding: 10px 12px; }
</style>

<script>/*
 * Puzzle engine — ruleset id below. (Participant pages carry no project or brand names.)
 *
 * ONE propagation law, nothing else:
 *   Fire starts at the fire square. It spreads from a burning square to every fuel
 *   square that shares a side with it, one step at a time. Each fuel square burns once.
 *   A home warms when a burning square shares a side with it. Corners never touch.
 *
 * Not present by design (mandate): wind, frost of any thickness, timing rules,
 * multi-hit, double-path, branch priority, mid-burn control, economy.
 *
 * The outcome is a pure function of the final set of fuel squares, so placement
 * order cannot matter. Preview, strike animation and result all call burn().
 *
 * Loaded as a classic script in the page (global FLE) and with require() in Node.
 */
'use strict';

/** Scene definition as stored in scenes.json. */
                           
                                                                                     
                                      
 
/** Parsed scene. */
                        
                                                                                       
                                                
 
                             
                                                                         
                
                                               
                  
                                                                                                  
 
                                                                                           
                               

                                                       

const FLE = (function () {
  const RULESET = 'fl1-rules-r1';
  const SNOW = 0, ROCK = 1, SOURCE = 2, HOME = 3;
  /** Fixed neighbour order N, E, S, W (all tie-breaks depend on it). */
  const DIRS                                           = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  /** Base shapes. Screen coordinates: x right, y down. */
  const PIECE_BASE                        = {
    I2: [[0, 0], [1, 0]],
    I3: [[0, 0], [1, 0], [2, 0]],
    L3: [[0, 0], [0, 1], [1, 1]],
    T4: [[0, 0], [1, 0], [2, 0], [1, 1]],
  };

  function normalize(cells       )        {
    let mx = Infinity, my = Infinity;
    for (const [x, y] of cells) { if (x < mx) mx = x; if (y < my) my = y; }
    const out = cells.map(([x, y]) => [x - mx, y - my]);
    out.sort((a, b) => (a[1] - b[1]) || (a[0] - b[0]));
    return out;
  }
  /** 90 degrees clockwise on screen: right -> down -> left -> up. */
  function rotateCW(cells       )        { return normalize(cells.map(([x, y]) => [-y, x])); }

  /** distinct orientations, cycle order = repeated CW turns */
  const ORIENTS                          = {};
  for (const k of Object.keys(PIECE_BASE)) {
    const list          = [];
    let cur = normalize(PIECE_BASE[k]);
    for (let r = 0; r < 4; r++) {
      const key = JSON.stringify(cur);
      if (!list.some((o) => JSON.stringify(o) === key)) list.push(cur);
      cur = rotateCW(cur);
    }
    ORIENTS[k] = list;
  }
  function pieceSize(type        )         { return PIECE_BASE[type].length; }

  /**
   * Scene definition (JSON):
   *  { id, w, h, grid: string[h] of '.', '#', 'F', 'H'; hand: string[]; laid?: number[] }
   */
  function parseScene(def          )        {
    const w = def.w, h = def.h;
    if (!Array.isArray(def.grid) || def.grid.length !== h) throw new Error('bad grid ' + def.id);
    const cells = new Uint8Array(w * h);
    let source = -1; const homes           = [];
    for (let y = 0; y < h; y++) {
      const row = def.grid[y];

      for (let x = 0; x < w; x++) {
        const c = row[x], i = y * w + x;
        if (c === '.') cells[i] = SNOW;
        else if (c === '#') cells[i] = ROCK;
        else if (c === 'F') { cells[i] = SOURCE; if (source >= 0) throw new Error('two fires ' + def.id); source = i; }

  }
  function fuelList(fuel                   )           { const out           = []; for (let i = 0; i < fuel.length; i++) if (fuel[i]) out.push(i); return out; }

  /**
   * THE propagation law. Pure function of (scene, final fuel set).
   * t[i] = step at which square i is burning (fire square = 0), -1 if never.
   * homeT[k] = step at which home k warms (one step after a side-neighbour burns), -1 if cold.
   */
  function burn(sc       , fuel                   )             {
    const n = sc.w * sc.h;
    const t = new Int16Array(n).fill(-1);
    t[sc.source] = 0;
    const q = [sc.source];
    for (let qi = 0; qi < q.length; qi++) {
      const c = q[qi];
      for (const nb of neighbors(sc, c)) {
        if (fuel[nb] && sc.cells[nb] === SNOW && t[nb] < 0) { t[nb] = t[c] + 1; q.push(nb); }
      }
    }
    const homeT = sc.homes.map((hm) => {
      let best = -1;
      for (const nb of neighbors(sc, hm)) {
        if (t[nb] >= 0) { const v = t[nb] + 1; if (best < 0 || v < best) best = v; }

      if (fuel[i]) { if (t[i] >= 0) burnt++; else unburnt++; }

    for (const v of homeT) if (v > steps) steps = v;

  }

  /**
   * After a miss: for every cold home, where the fire stopped (endpoint) and the first
   * square where a connection is missing (gap). 0-1 BFS from all burning squares
   * through snow (cost 1) and unburnt fuel (cost 0) to a snow square beside the home.
   * Deterministic: starts in index order, neighbours N,E,S,W.
   */
  function missMarkers(sc       , fuel                   , b            )               {
    const res               = [];
    for (const k of b.cold) {
      const hm = sc.homes[k];
      const targets = new Set(neighbors(sc, hm).filter((i) => sc.cells[i] === SNOW));
      const n = sc.w * sc.h;

      const par = new Int32Array(n).fill(-1);
      const dq           = [];
      for (let i = 0; i < n; i++) if (b.t[i] >= 0) { dist[i] = 0; dq.push(i); }

      const done = new Uint8Array(n);
      for (;;) {
        const c = popNext();
        if (c < 0) break;
        if (done[c]) continue;
        done[c] = 1;
        if (targets.has(c) && b.t[c] < 0) { found = c; break; }
        for (const nb of neighbors(sc, c)) {
          if (sc.cells[nb] !== SNOW || b.t[nb] >= 0 || done[nb]) continue;
          const w = fuel[nb] ? 0 : 1;
          if (dist[c] + w < dist[nb]) {

            if (w === 0) front.push(nb); else dq.push(nb);

      if (found < 0) { res.push({ home: k, endpoint: -1, gap: -1, path: [] }); continue; }
      const path           = [];
      for (let c = found; c >= 0; c = par[c]) path.push(c);
      path.reverse();
      const endpoint = path[0];
      const gap = path.find((c) => b.t[c] < 0 && !fuel[c]);
      res.push({ home: k, endpoint, gap: gap === undefined ? -1 : gap, path });
    }
    return res;
  }

  /** Cells of a piece placement (orientation index o, anchor x,y = top-left of orientation box). */
  function placementCells(type        , o        , x        , y        )        {
    const ori = ORIENTS[type][o % ORIENTS[type].length];
    return ori.map(([dx, dy]) => [x + dx, y + dy]);
  }
  /** occ: piece id per cell or -1 */
  function canPlace(sc       , occ                   , cellsXY       , ignoreId         )          {
    for (const [x, y] of cellsXY) {
      if (x < 0 || y < 0 || x >= sc.w || y >= sc.h) return false;
      const i = y * sc.w + x;
      if (sc.cells[i] !== SNOW) return false;
      if (occ[i] >= 0 && occ[i] !== ignoreId) return false;
    }
    return true;
  }
  /** Junction squares: fuel squares with 3 or more side contacts among fuel and the fire (homes do not count). */

    return out;

  function structureKey(fuel                   )         { return fuelList(fuel).join(','); }

  return {
    RULESET, SNOW, ROCK, SOURCE, HOME, DIRS, PIECE_BASE, ORIENTS,
    normalize, rotateCW, pieceSize, parseScene, neighbors, emptyFuel, fuelFrom, fuelList, fuelCount,

<script>/*
 * Board model: the only code that changes a scene's board. The page sends every board action
 * through apply() and records it in the scene's input log; the replay tool (tools/replay.ts) runs
 * the same apply() on a recorded log and must reach the same state hash.
 *
 * An action is a short array, [name, ...arguments]:
 *   A (pieces)   ['tturn', id]          turn a piece in the tray (not a board change, not undoable)
 *                ['place', id, x, y]    tray piece onto the board, top-left of its box at x,y, as turned
 *                ['move', id, x, y]     a piece on the board to x,y
 *                ['bturn', id]          turn a piece on the board in place (nudged by one square if needed)
 *                ['unplace', id]        a piece on the board back to the tray
 *   C (draw)     ['stroke', path]       one finger stroke: path = squares passed, each beside the last;
 *                                       empty squares on it get fuel while material lasts
 *                ['erase', cell]        tap on fuel to remove it
 *   A, C         ['undo']               reverse the last board change
 *   probes (P)   ['toggle', cell]       the one-square change (toggling the same square again undoes it)
 *   all          ['strike', predicted]  burn the structure; predicted = homes the player chose, or null
 *                ['replay']             "Play this board again": the board starts over
 *                ['end', outcome]       the scene ends (solved, skipped, timeUp, probe; quit = Finish now in the optional scene)
 * Anything else, or an action that is not legal in the current state, is refused and changes nothing.
 * Loaded as a classic script in the page (global FLM) and with require() in Node.
 */
'use strict';
                                                 
                                             

                                         
                                                                                                     
                                                                                                                                                       
                        
                                                                        
                                    
                                    
                                    
                                      
                                              
                         
                                  
            
 
                                                              
                                                                                                  
                                                                                                  

                                                       
                                               

const FLM = (function (E        , H           ) {
  const SCHEMA = 'fl1r1-state-1';
  const UNDO_CAP = 60;
  const OUTCOMES = ['solved', 'skipped', 'timeUp', 'probe', 'quit'];
  /** Where a turned piece may go if it does not fit in place: centre first, then one square N, E, S, W. */
  const NUDGE                                           = [[0, 0], [0, -1], [1, 0], [0, 1], [-1, 0]];

  function newBoard(sc       , cond      , sid        , sceneHash        , laid          )        {
    const b        = {
      sid, sceneHash, cond, sc, laid: laid.slice(), pieces: [], fuel: E.emptyFuel(sc), undo: [], replay: 0, strikes: [],
      edit: null, outcome: null, n: 0,
    };
    if (cond === 'A') b.pieces = sc.hand.map((type, id) => ({ id, type, o: 0, x: 0, y: 0, placed: false }));
    if (cond === 'B' || cond === 'P') b.fuel = E.fuelFrom(sc, laid);
    return b;
  }

  function occupancy(b       , ignoreId        )             {
    const occ = new Int16Array(b.sc.w * b.sc.h).fill(-1);
    for (const p of b.pieces) if (p.placed && p.id !== ignoreId) for (const [x, y] of E.placementCells(p.type, p.o, p.x, p.y)) occ[y * b.sc.w + x] = p.id;
    return occ;
  }
  /** The fuel set the burn uses: placed pieces in A, the board's fuel otherwise. */
  function fuelOf(b       )             {
    if (b.cond !== 'A') return b.fuel;
    const f = E.emptyFuel(b.sc);
    for (const p of b.pieces) if (p.placed) for (const [x, y] of E.placementCells(p.type, p.o, p.x, p.y)) f[y * b.sc.w + x] = 1;
    return f;
  }
  function dims(cells            )                   { let w = 0, h = 0; for (const [x, y] of cells) { if (x + 1 > w) w = x + 1; if (y + 1 > h) h = y + 1; } return [w, h]; }
  function orients(type        )               { return E.ORIENTS[type]; }

  /** Where a turn of a placed piece lands (the same rule the page shows while turning), or null. */
  function boardTurn(b       , p       )                                             {
    const n = orients(p.type).length;
    if (n === 1) return null;
    const no = (p.o + 1) % n;
    const [w0, h0] = dims(orients(p.type)[p.o % n]); const [w1, h1] = dims(orients(p.type)[no]);
    const cx = p.x + (w0 - 1) / 2, cy = p.y + (h0 - 1) / 2;
    const bx = Math.floor(cx - (w1 - 1) / 2 + 0.5), by = Math.floor(cy - (h1 - 1) / 2 + 0.5);
    const occ = occupancy(b, p.id);
    for (const [dx, dy] of NUDGE) {
      const cells = E.placementCells(p.type, no, bx + dx, by + dy);
      if (E.canPlace(b.sc, occ, cells, p.id)) return { o: no, x: bx + dx, y: by + dy };
    }
    return null;
  }

  const isInt = (v         )              => typeof v === 'number' && Number.isInteger(v);
  function cellOk(b       , c         )              { return isInt(c) && c >= 0 && c < b.sc.w * b.sc.h; }
  function sideBySide(b       , i        , j        )          {
    const w = b.sc.w, xi = i % w, yi = (i - xi) / w, xj = j % w, yj = (j - xj) / w;
    return Math.abs(xi - xj) + Math.abs(yi - yj) === 1;
  }

  /**
   * What a stroke along `path` paints: every square on it must be snow and beside the one before it
   * (so a stroke never leaves a square that touches the last one only at a corner, or jumps a rock);
   * empty squares get fuel in order until the material runs out.
   */
  function strokePaint(b       , path         )               {
    if (!Array.isArray(path) || path.length === 0) return { ok: false, reason: 'empty path', painted: [], noMore: false };
    const fuel = b.fuel; const painted           = []; const seen = new Set        ();
    let count = E.fuelCount(fuel), noMore = false;
    for (let k = 0; k < path.length; k++) {
      const c = path[k];
      if (!cellOk(b, c)) return { ok: false, reason: 'bad square in path', painted: [], noMore: false };
      if (b.sc.cells[c] !== E.SNOW) return { ok: false, reason: 'path crosses a square that is not snow', painted: [], noMore: false };
      if (k > 0 && !sideBySide(b, path[k - 1]          , c)) return { ok: false, reason: 'path squares not side by side', painted: [], noMore: false };
      if (fuel[c] || seen.has(c)) continue;
      if (count >= b.sc.budget) { noMore = true; continue; }
      seen.add(c); painted.push(c); count++;
    }
    return { ok: true, painted, noMore };
  }

  function pushUndo(b       , snap                      )       { b.undo.push(snap); if (b.undo.length > UNDO_CAP) b.undo.shift(); }
  const snapPieces = (b       )          => b.pieces.map((p) => ({ ...p }));
  const no = (reason        )              => ({ ok: false, reason });

  /** Apply one action. Refused actions change nothing. */
  function apply(b       , a        )              {
    if (!Array.isArray(a) || typeof a[0] !== 'string') return no('not an action');
    if (b.outcome !== null) return no('scene already ended');
    const name = a[0];
    const r = applyInner(b, name, a);
    if (r.ok) b.n++;
    return r;
  }
  function applyInner(b       , name        , a        )              {
    const A = b.cond === 'A', C = b.cond === 'C', P = b.cond === 'P';
    const piece = (v         )               => (A && isInt(v) && v >= 0 && v < b.pieces.length ? b.pieces[v] : null);
    switch (name) {
      case 'tturn': {
        if (a.length !== 2) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        if (p.placed) return no('piece is on the board');
        const n = orients(p.type).length; if (n === 1) return no('piece does not turn');
        p.o = (p.o + 1) % n; return { ok: true };
      }
      case 'place': case 'move': {
        if (a.length !== 4) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        const x = a[2], y = a[3]; if (!isInt(x) || !isInt(y)) return no('bad position');
        if ((name === 'place') === p.placed) return no(name === 'place' ? 'piece is already on the board' : 'piece is not on the board');
        const cells = E.placementCells(p.type, p.o, x, y);
        if (!E.canPlace(b.sc, occupancy(b, p.id), cells, p.id)) return no('does not fit there');
        pushUndo(b, snapPieces(b));
        p.placed = true; p.x = x; p.y = y; return { ok: true };
      }
      case 'bturn': {
        if (a.length !== 2) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        if (!p.placed) return no('piece is not on the board');
        const t = boardTurn(b, p); if (!t) return no('no room to turn');
        pushUndo(b, snapPieces(b));
        p.o = t.o; p.x = t.x; p.y = t.y; return { ok: true };
      }
      case 'unplace': {
        if (a.length !== 2) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        if (!p.placed) return no('piece is not on the board');
        pushUndo(b, snapPieces(b));
        p.placed = false; return { ok: true };
      }
      case 'stroke': {
        if (!C) return no('not a drawing scene');
        if (a.length !== 2) return no('arguments');
        const s = strokePaint(b, a[1]);
        if (!s.ok) return no(s.reason || 'bad stroke');
        if (!s.painted.length) return no('stroke painted nothing');
        pushUndo(b, new Uint8Array(b.fuel));
        const f = new Uint8Array(b.fuel); for (const c of s.painted) f[c] = 1; b.fuel = f;
        return { ok: true, painted: s.painted };
      }
      case 'erase': {
        if (!C) return no('not a drawing scene');
        if (a.length !== 2 || !cellOk(b, a[1])) return no('arguments');
        const c = a[1]          ; if (!b.fuel[c]) return no('no fuel there');
        pushUndo(b, new Uint8Array(b.fuel));
        const f = new Uint8Array(b.fuel); f[c] = 0; b.fuel = f; return { ok: true };
      }
      case 'undo': {
        if (!(A || C)) return no('nothing to undo here');
        if (a.length !== 1) return no('arguments');
        const s = b.undo.pop(); if (!s) return no('nothing to undo');
        // a piece that stays in the tray keeps the way it was turned
        if (A) b.pieces = (s           ).map((q) => { const cur = b.pieces[q.id]; return !q.placed && cur && !cur.placed ? { ...q, o: cur.o } : { ...q }; });
        else b.fuel = new Uint8Array(s              );
        return { ok: true };
      }
      case 'toggle': {
        if (!P) return no('not a probe');
        if (a.length !== 2 || !cellOk(b, a[1])) return no('arguments');
        if (b.strikes.length !== 1) return no('the change comes after the first outcome');
        const c = a[1]          ; if (b.sc.cells[c] !== E.SNOW) return no('not snow');
        if (b.edit && b.edit.cell !== c) return no('only one square may change');
        const f = new Uint8Array(b.fuel); f[c] = f[c] ? 0 : 1; b.fuel = f;
        b.edit = b.edit ? null : { cell: c, add: !!f[c] };
        return { ok: true };
      }
      case 'strike': {
        if (a.length !== 2) return no('arguments');
        const pr = a[1];
        if (pr !== null) {
          if (!Array.isArray(pr)) return no('bad prediction');
          for (let k = 0; k < pr.length; k++) if (!isInt(pr[k]) || pr[k] < 0 || pr[k] >= b.sc.homes.length || (k > 0 && pr[k] <= pr[k - 1])) return no('bad prediction');
        }
        if (P && b.strikes.length >= 2) return no('both probe outcomes already shown');
        if (P && b.strikes.length === 1 && !b.edit) return no('the change comes first');
        const fuel = fuelOf(b);
        const r = E.burn(b.sc, fuel);
        const st         = { fuel: E.fuelList(fuel), warm: r.warm, cold: r.cold, success: r.success, steps: r.steps, predicted: pr === null ? null : (pr            ).slice(), replay: b.replay };
        b.strikes.push(st);
        return { ok: true, strike: st };
      }
      case 'replay': {
        if (P) return no('not in probes');
        if (a.length !== 1) return no('arguments');
        if (!b.strikes.some((s) => s.success && s.replay === b.replay)) return no('replay comes after a success');
        b.replay++; b.undo = [];
        if (A) b.pieces.forEach((p) => { p.placed = false; p.o = 0; p.x = 0; p.y = 0; });
        if (C) b.fuel = E.emptyFuel(b.sc);
        return { ok: true };
      }
      case 'end': {
        if (a.length !== 2 || typeof a[1] !== 'string' || !OUTCOMES.includes(a[1])) return no('bad outcome');
        if (a[1] === 'solved' && !b.strikes.some((s) => s.success)) return no('not solved');
        if ((a[1] === 'probe') !== P) return no('probe outcome only in probes');
        b.outcome = a[1]; return { ok: true };
      }
      default: return no('unknown action ' + name);
    }
  }

  /** Canonical state: everything the board and its outcomes depend on, in a fixed order. */
  function canonical(b       )          {
    return {
      v: SCHEMA, ruleset: E.RULESET, sid: b.sid, sceneHash: b.sceneHash, cond: b.cond,
      pieces: b.cond === 'A' ? b.pieces.map((p) => [p.id, p.type, p.o, p.placed ? 1 : 0, p.placed ? p.x : -1, p.placed ? p.y : -1]) : null,
      fuel: E.fuelList(fuelOf(b)),
      edit: b.edit ? b.edit.cell : -1,
      strikes: b.strikes.map((s) => [s.fuel.join(','), s.warm.join(','), s.predicted === null ? null : s.predicted.join(','), s.success ? 1 : 0, s.replay]),
      replay: b.replay, actions: b.n, outcome: b.outcome,
    };
  }
  function stateHash(b       )         { return H.sha256Hex(JSON.stringify(canonical(b))); }
  /** Hash of the action list itself (times excluded). */
  function logHash(actions          )         { return H.sha256Hex(JSON.stringify(actions)); }

  /** Rebuild a board from its log. Stops at the first refused action. */
  function replayLog(sc       , cond      , sid        , sceneHash        , laid          , actions          )                                                     {
    const b = newBoard(sc, cond, sid, sceneHash, laid);
    for (let k = 0; k < actions.length; k++) {
      const r = apply(b, actions[k]);
      if (!r.ok) return { board: b, error: 'action ' + k + ' (' + JSON.stringify(actions[k]) + ') refused: ' + r.reason, at: k };
    }
    return { board: b, error: null, at: actions.length };
  }

  return { SCHEMA, UNDO_CAP, newBoard, occupancy, fuelOf, boardTurn, strokePaint, apply, canonical, stateHash, logHash, replayLog, sideBySide };

  typeof module === 'object' && module ? (require('./sha256.ts')             ) : (globalThis       ).FLHash,
);
                                

if (typeof module === 'object' && module && module.exports) module.exports = FLM;
else (globalThis       ).FLM = FLM;

<script>/*
 * Shared page basics: address flags, timing constants, the frozen participant text, and small DOM helpers.
 * HOSTED BUILD (FL-1-R1-H1): only the ui_hosted module talks to the network (the receiver, after consent);
 * the Content-Security-Policy allows the receiver's two hosts and nothing else. Conditions: A = place pieces, B = ready-made path, C = draw the path.
 * Every Preview, burn and result calls FLE.burn() on the same final fuel set.
 * One of the page modules (load order: ui_common, ui_record, ui_render, ui_preview, ui_input, ui_scene, ui_testhooks, ui_flow). Modules share
 * nothing but window.FL1R1_UI: functions from another module are called through it when they run, constants
 * come from modules loaded earlier, and the shared state (RUN, FLOW, stepIdx, FROZEN, T0) lives on it.
 */
'use strict';
(function () {
  const W = window       ;
  const U = (W.FL1R1_UI = {})       ;
  U.RUN = null; // the scene or probe on screen (ui_scene)
  U.FLOW = []; U.stepIdx = 0; // the participant flow and its current step (ui_flow)
  const ev = (...a       ) => U.ev(...a);
  const FLE = W.FLE, FLM = W.FLM, DATA = W.FL1R1_SCENES, BUILD = W.FL1R1_BUILD;
  const QS = (() => { const q = new URLSearchParams(location.search), s = q.get('slot'); return new URLSearchParams(s === null ? '' : 'slot=' + encodeURIComponent(s)); })(); // hosted: the address steers the slot only; test, dev, fast, resume and motion flags are ignored
  const TEST = QS.get('test') === '1';
  const DEV = TEST || QS.get('dev') === '1';
  const FAST = TEST && QS.get('fast') === '1';
  const RESUME = !TEST || QS.get('resume') === '1'; // tests opt in to resuming with &resume=1
  const STEP_MS = FAST ? 8 : 140;
  const TAIL_MS = FAST ? 20 : 650;
  const SKIP_AFTER_MS = 150000, SKIP_AFTER_TRIES = 4, TEACH_SKIP_MS = 90000, TEACH_SKIP_TRIES = 3;
  const BLOCK_ALLOWANCE_MS = 9 * 60000;
  const STORE_KEY = 'fl1r1-progress';
  const SAVE_EVERY_TICKS = 8; // 8 x 250 ms: the running scene is saved at least every 2 s
  const REFUSAL_MS = 700; // how long a refused-stroke mark stays on the square
  // reduced motion (the phone's setting, or &motion=reduce): no flicker and no shake; the burn still advances
  // one wave per step at the same speed in every version, so outcome timing does not change
  const REDUCED = QS.get('motion') === 'reduce' || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const IDLE_MS = 10000; // visible time with no touch for longer than this counts as idle
  const PTR_CAP = 4000; // pointer entries kept per scene

  /* ------------------------------------------------------------------ text (frozen) */
  // the three conditions are defined in the scene file (src/scenes.json "conditions")
  const COND = DATA.conditions;
  const TXT = {
    teachHint: {
      A: 'Drag a piece onto the snow. <b>Tap a piece to turn it.</b>',
      B: 'Check the path, then tap <b>Strike</b>.',
      C: 'Drag across the snow to lay fuel. <b>Tap fuel to remove it.</b>',
    },
    previewLine: 'Hold <b>Preview</b> to see what will burn.',
    mainHint: {
      A: 'Build a path of fuel from the fire to every home.',
      B: 'Check the path, then strike.',
      C: 'Draw a path of fuel from the fire to every home.',
    },
    predict: 'What do you think will happen? Tap the homes you think will warm, then tap <b>Strike</b>.',
    success: 'Every home is warm.',
    miss: 'Not every home is warm.',
    replay: 'Play this board again',
    noMore: 'No fuel left — tap fuel to remove some.',
    refused: 'Fuel goes square by square over snow: go round rocks, homes and the fire.',
    dropFail: 'A piece only fits on empty snow.',
    turnFail: 'No room to turn it here.',
    timeUp: 'Time for this version is up.',
    probePredict: 'What do you think will happen? Tap the homes you think will warm, then tap <b>Done</b>.',
    probeEdit: 'What change would alter it? Change <b>one</b> square: tap snow to add fuel, or tap fuel to remove it.',
    bTap: 'This path is already built: hold <b>Preview</b> to check it, then tap <b>Strike</b>.',
    probeRepredict: 'What do you think will happen now? Tap the homes you think will warm, then tap <b>Done</b>.',
    why: 'Why did that happen?',
  };

  const app = (document.getElementById('app')               );
  /* ------------------------------------------------------------------ helpers */
  function h(tag        , attrs      , ...kids       )              {
    const e = document.createElement(tag);
    if (attrs) for (const k of Object.keys(attrs)) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  }
  function clear() { app.innerHTML = ''; }
  function sheet(...kids) { clear(); const s = h('div', { class: 'sheet' }, ...kids); app.append(s); s.scrollTop = 0; return s; }
  function condLabel(c) { return COND[c].sym + ' ' + COND[c].name; }

  function likert(id, label, lo, hi, store) {
    const wrap = h('div', { class: 'card' }, h('div', null, label));
    const row = h('div', { class: 'likert', role: 'radiogroup', 'aria-label': label });
    for (let v = 1; v <= 7; v++) {
      const b = h('button', { type: 'button', 'data-v': v, onclick: () => { store[id] = v; [...row.children].forEach((x) => x.classList.toggle('sel', x === b)); ev('likert', [id, v]); } }, String(v));
      row.append(b);
    }
    wrap.append(row, h('div', { class: 'ends' }, h('span', null, lo), h('span', null, hi)));
    return wrap;
  }
  function textQ(id, label, store, required          ) {
    const ta = (h('textarea', { 'data-q': id, maxlength: '600', 'aria-label': label })                       );
    ta.addEventListener('input', () => { store[id] = ta.value; });
    return h('div', { class: 'card' }, h('div', null, label + (required ? '' : ' (optional)')), ta);
  }
  function validText(s) { return typeof s === 'string' && s.trim().length >= 2; }

  Object.assign(U, { FLE, FLM, DATA, BUILD, QS, TEST, DEV, RESUME, STEP_MS, TAIL_MS, SKIP_AFTER_MS, SKIP_AFTER_TRIES, TEACH_SKIP_MS, TEACH_SKIP_TRIES, BLOCK_ALLOWANCE_MS, STORE_KEY, SAVE_EVERY_TICKS, REFUSAL_MS, REDUCED, IDLE_MS, PTR_CAP, COND, TXT, app, h, clear, sheet, condLabel, likert, textQ, validText });
})();

<script>/*
 * Instrumentation: the session record, events, errors, the pointer log, and where progress is kept for a reload.
 * One of the page modules (load order: ui_common, ui_record, ui_render, ui_preview, ui_input, ui_scene, ui_testhooks, ui_flow). Modules share
 * nothing but window.FL1R1_UI: functions from another module are called through it when they run, constants
 * come from modules loaded earlier, and the shared state (RUN, FLOW, stepIdx, FROZEN, T0) lives on it.
 */
'use strict';
(function () {
  const W = window       ;
  const U = W.FL1R1_UI;
  const { BUILD, DATA, DEV, FLE, PTR_CAP, REDUCED, STORE_KEY, TEST } = U;
  const cellAt = (...a       ) => U.cellAt(...a);
  const deviceLine = (...a       ) => U.deviceLine(...a);
  const liveState = (...a       ) => U.liveState(...a);
  const updateG3 = (...a       ) => U.updateG3(...a);
  /* ------------------------------------------------------------------ progress kept for a reload */
  /**
   * Hosted page: the session is kept in local storage of the study's own origin, so reopening the original link in this
   * browser resumes it after the tab was closed; ui_hosted uploads it to the receiver. If storage is refused, the tab's
   * window name is used (ui_hosted then stops before consent: the study needs storage).
   */
  const STORE = (() => {
    try {
      const k = STORE_KEY + '-check'; localStorage.setItem(k, '1'); localStorage.removeItem(k);
      return { kind: 'local', get: ()                => localStorage.getItem(STORE_KEY), set: (v        ) => localStorage.setItem(STORE_KEY, v) };

   */
  function exitScreen() {
    const g = REC.g3; const c = g.choice; const played = c && c !== 'stop';
    const store                      = { cont: g.cont || null };
    const err = h('div', { class: 'err' });
    const kids        = [h('h1', null, played ? 'Thanks for playing' : 'Nearly done')];
    if (played) {
      const yes = h('button', { class: 'choice half', type: 'button', 'data-cont': 'yes', onclick: () => pick('yes') }, 'Yes');
      const no = h('button', { class: 'choice half', type: 'button', 'data-cont': 'no', onclick: () => pick('no') }, 'No');
      const pick = (v) => { store.cont = v; yes.classList.toggle('sel', v === 'yes'); no.classList.toggle('sel', v === 'no'); ev('contTap', v); };
      kids.push(h('div', { class: 'card' }, h('div', null, 'Would you like to play another scene like this one?'), h('div', { class: 'row' }, yes, no)));
    }
    kids.push(textQ('exitWhy', played ? 'In a few words, why did you choose ' + condLabel(c) + '?' : 'In a few words, why did you choose to finish?', store, false));
    kids.push(err, h('button', { class: 'primary', style: 'width:100%', onclick: () => {
      if (played && !store.cont) { err.textContent = 'Please answer the first question.'; return; }
      g.cont = store.cont; g.exitWhy = validText(store.exitWhy) ? store.exitWhy : ''; g.flowDone = true; ev('exit', [g.cont || '', g.exitWhy ? 1 : 0]);
      finish();
    } }, 'Finish'));
    if (DEV) kids.push(devRecordPanel());
    sheet(...kids);
    save();
  }
  function startG3Scene(c) {
    teardownScene();
    startScene({ kind: 'scene', cond: c, scene: DATA.extras[1], block: 4, idx: 0, g3: true }, () => { SHOW.complete(); });
  }
  function finish() {
    if (REC.finishedAt == null) { ev('finish'); REC.finishedAt = now(); }
    freezeRecord();
    allDone();
  }
  function allDone() {
    const kids = [h('h1', null, 'All done.'), h('p', null, 'You can close this page now.'), ...(U.HOSTED ? U.HOSTED.doneParts() : [])];
    if (DEV) kids.push(devRecordPanel());
    sheet(...kids);
  }
  function devRecordPanel() {
    const json = JSON.stringify(REC);
    const pre = h('pre', { class: 'rec', id: 'rec' }, json.slice(0, 4000) + (json.length > 4000 ? '…' : ''));
    const a = h('a', { href: 'data:application/json;charset=utf-8,' + encodeURIComponent(json), download: 'fl1r1-record-' + (REC.slot || 'free') + '.json' }, 'Download session record');
    return h('div', { class: 'card' }, h('div', { class: 'small' }, 'Owner/test view only: session record (' + json.length + ' bytes). Nothing was sent.'), a, pre);
  }

  /* ------------------------------------------------------------------ rule diagrams */
  function ruleSvg(kind) {
    const s = 26, cells = [];
    const sq = (x        , y        , fill        , extra         ) => cells.push(`<rect x="${x * s + 2}" y="${y * s + 2}" width="${s - 4}" height="${s - 4}" rx="5" fill="${fill}" ${extra || ''}/>`);
    const fire = (x, y) => cells.push(`<circle cx="${x * s + s / 2}" cy="${y * s + s / 2}" r="${s / 2 - 3}" fill="#f06a1d"/><circle cx="${x * s + s / 2}" cy="${y * s + s / 2 + 2}" r="${s / 5}" fill="#ffd43b"/>`);
    const home = (x, y, warm) => cells.push(`<path d="M${x * s + 4} ${y * s + s / 2} L${x * s + s / 2} ${y * s + 4} L${x * s + s - 4} ${y * s + s / 2} V${y * s + s - 4} H${x * s + 4} Z" fill="${warm ? '#9a6b2f' : '#5c6b78'}"/><rect x="${x * s + s / 2 - 4}" y="${y * s + s / 2 + 1}" width="8" height="7" fill="${warm ? '#ffd43b' : '#3a4550'}"/>`);
    let wpx = 5;
    if (kind === 1) { fire(0, 0); sq(1, 0, '#f08c3a'); sq(2, 0, '#f08c3a'); sq(3, 0, '#f08c3a'); sq(4, 0, '#b08968'); wpx = 5; }
    if (kind === 2) { fire(0, 0); sq(1, 0, '#f08c3a'); sq(2, 0, '#f08c3a'); home(3, 0, true); wpx = 4; }
    if (kind === 3) { fire(0, 1); sq(1, 1, '#f08c3a'); sq(2, 0, '#b08968', 'stroke="#c2410c" stroke-dasharray="3 2"'); home(3, 0, false); wpx = 4; }
    const hh = kind === 3 ? 2 : 1;
    const svg = `<svg class="ruleimg" width="${wpx * s}" height="${hh * s}" viewBox="0 0 ${wpx * s} ${hh * s}" aria-hidden="true">${cells.join('')}</svg>`;
    return h('div', { html: svg });
  }

  SHOW.scene = (st) => startScene(st, () => next());
  SHOW.probe = (st) => startScene({ ...st, cond: 'P' }, () => next());
  /* ------------------------------------------------------------------ owner landing */
  /** The landing's device facts. Chrome's browser string always says Android 10, so the Android version is shown
   *  only when Chrome reports the real one (it may not to a page opened from a file); the phone's settings have it. */
  function deviceLine() {
    const d = REC.device;
    const os = /^Android/.test(d.os) ? (d.platform === 'Android' && d.platformVersion ? 'Android ' + String(d.platformVersion).split('.')[0] : 'Android (version not reported to the page)') : d.os;
    return 'This device: ' + os + ' · ' + d.browser + ' · ' + d.vw + '×' + d.vh + ' at ' + (+d.dpr).toFixed(2) + ' · touch ' + (d.touch ? 'yes' : 'no') + ' · reduced motion ' + (REDUCED ? 'on' : 'off') + ' · no sound in any version'
      + ' · progress kept ' + (STORE.kind === 'session' ? 'in session storage' : 'in this tab only (session storage refused)');
  }
  function landing() {
    if (U.HOSTED) { invalidLink(); return; } // hosted: never the owner landing, free play or self-test
    const list = h('div', { class: 'list' });
    for (const a of DATA.assignment) {
      list.append(h('button', { 'data-slot': a.slot, onclick: () => { if (!TEST) { try { history.replaceState(null, '', '?slot=' + a.slot); } catch (e) { /* file: or sandbox may refuse; resume then needs ?slot= */ } } start(a); } }, h('b', null, a.slot), '  order ', a.order.split('').map((c) => COND[c].sym).join(' '), '  ', h('span', { class: 'small' }, '(sets A→' + a.sets.A + ', B→' + a.sets.B + ', C→' + a.sets.C + '; lists ' + (a.display || 'ABC').split('').map((c) => COND[c].sym).join(' ') + ')')));
    }
    const free = h('div', { class: 'list' });
    for (const c of ['A', 'B', 'C']) for (const sid of Object.keys(DATA.scenes).filter((k) => DATA.scenes[k].kind !== 'probe')) {
      free.append(h('button', { 'data-free': c + ':' + sid, onclick: () => { REC.slot = 'free'; startScene({ kind: 'scene', cond: c, scene: sid, block: 9, idx: 0 }, landing); } }, condLabel(c) + ' — ' + sid));
    }
    for (const sid of DATA.probes) free.append(h('button', { 'data-free': 'P:' + sid, onclick: () => { REC.slot = 'free'; startScene({ kind: 'probe', cond: 'P', scene: sid, block: 9, idx: DATA.probes.indexOf(sid) }, landing); } }, 'Quick puzzle — ' + sid));
    // a test slot in progress in this tab (an owner copy opened from a file cannot always keep ?slot= in its address)
    const prev = RESUME ? storedSession() : null;
    const pa = prev && prev.rec && prev.rec.slot && prev.rec.finishedAt == null && !(prev.rec.consent && prev.rec.consent.declined) ? DATA.assignment.find((x) => x.slot === prev.rec.slot) : null;
    const resumeBtn = pa ? h('button', { class: 'primary', id: 'resumeSlot', style: 'width:100%', onclick: () => resumeSession(pa, prev) }, 'Resume test slot ' + pa.slot + ' (in progress in this tab)') : null;
    const out = h('div', { class: 'small', id: 'selftestOut' });
    const self = h('button', { id: 'selftest', style: 'width:100%', onclick: () => { const r = runSelfTest(); out.textContent = r.text; ev('selftest', [r.pass, r.total]); } }, 'Run the replay self-test');
    sheet(
      h('h1', null, 'Test build — owner and reviewer copy'),
      h('p', { class: 'small' }, 'Not a participant link: nothing is recorded outside this page and nothing is sent anywhere. Build ' + BUILD.id + ', scenes ' + String(DATA.scenesHash).slice(0, 12) + '.'),
      h('p', { class: 'small', id: 'deviceLine' }, deviceLine()),
      ...(resumeBtn ? [resumeBtn] : []),
      h('h2', null, 'Phone check: replay and state hash'), self, out,
      h('h2', null, 'Play a full session as a test slot'), list,
      h('h2', null, 'Free play: any scene in any version'), free
    );
  }
  /** Replays the built-in input logs on this device and compares the state and log hashes with Node's (phone check). */
  function runSelfTest() {
    const st = DATA.selftest || { vectors: [], sha: [] };
    let pass = 0; const lines           = [];
    for (const v of st.vectors) {
      const def = DATA.scenes[v.sid]; const sc = FLE.parseScene(def);
      const rr = FLM.replayLog(sc, v.cond, v.sid, DATA.hashes[v.sid], def.laid || [], v.log);
      const got = rr.error ? 'error' : FLM.stateHash(rr.board);
      const ok = !rr.error && got === v.stateHash && FLM.logHash(v.log) === v.logHash;
      if (ok) pass++;
      lines.push(v.sid + ' ' + v.cond + ' (' + v.log.length + ' actions): ' + (ok ? 'same hash ' : 'DIFFERENT ') + String(got).slice(0, 12));
    }
    let shaOk = 0; for (const [txt, want] of st.sha) if (W.FLHash.sha256Hex(txt) === want) shaOk++;
    const total = st.vectors.length;
    const text = (pass === total && shaOk === st.sha.length ? 'PASS: ' : 'FAIL: ') + pass + ' of ' + total + ' input logs reproduce their state hash; SHA-256 known answers ' + shaOk + ' of ' + st.sha.length + '. ' + lines.join('; ') + '.';
    return { pass, total, shaOk, text };
  }
  function invalidLink() {
    ev('invalidLink');
    sheet(h('h1', null, 'This link is not valid.'), h('p', null, 'Please go back to the study page and use the link you were given.'));
  }

  /* ------------------------------------------------------------------ boot */
  function boot() {
    if (REDUCED) document.documentElement.classList.add('reduce');
    if (U.HOSTED) { const g = U.HOSTED.admit(); if (g === 'nocred') { invalidLink(); return; } if (g === 'declined') { U.FROZEN = true; declinedScreen(); return; } if (g !== 'ok') return; } // hosted: the Chrome gate and the invitation first
    const want = QS.get('slot');
    if (want === null) { landing(); return; }
    const a = DATA.assignment.find((x) => x.slot === want);
    if (!a) { invalidLink(); return; } // never show the owner landing to a mistyped participant link
    const resumed = storedSession();
    if (RESUME && resumed && resumed.slot === want && resumed.rec && resumed.rec.slot === want) { resumeSession(a, resumed); return; }
    start(a);
  }
  /** Continue the same session: same time base, same record, same step (a running scene is restored). */
  function resumeSession(a, resumed) {
    Object.assign(REC, resumed.rec);
    U.T0 = REC.t0 || Date.parse(REC.startedAt) || U.T0;
    REC.resumes = (REC.resumes || []).concat([now()]);
    setSlot(a); U.FLOW = buildFlow(a);
    ev('resume', resumed.stepIdx);
    if (REC.finishedAt != null) { U.FROZEN = true; U.stepIdx = U.FLOW.length - 1; allDone(); return; } // a finished session is never restarted or rewritten
    if (REC.consent && REC.consent.declined) { U.FROZEN = true; declinedScreen(); return; }
    go(Math.min(resumed.stepIdx, U.FLOW.length - 1), true);
  }

  Object.assign(U, { start, go, deviceLine });
  boot();
})();
</script>
