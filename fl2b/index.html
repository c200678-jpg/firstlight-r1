<style>:root {
  /* neutral dark background (mandate §8), the same in every version; the board itself stays light for contrast */
  --bg: #1e2226; --ink: #e8edf1; --muted: #a3aeb7; --card: #2b3137; --line: #434c54;
  --accent: #4d8dff; --accent-ink: #ffffff; --fire: #f06a1d; --warm: #ffcf3f; --cold: #6aa8ea; --bad: #ff8a4c;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { display: flex; justify-content: center; }
#app { width: 100%; max-width: 480px; min-height: 100%; display: flex; flex-direction: column; position: relative; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 4px; min-height: 44px; }
.badge { font-weight: 650; font-size: 17px; display: flex; align-items: center; gap: 6px; }
.badge .sym { font-size: 20px; line-height: 1; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--ink); }
.dots i.done { background: var(--muted); }
.hint { padding: 2px 14px 6px; min-height: 30px; color: var(--muted); font-size: 15px; }
.hint b { color: var(--ink); }
#stage { position: relative; display: flex; justify-content: center; }
canvas#board { touch-action: none; display: block; user-select: none; -webkit-user-select: none; }
.controls { display: flex; gap: 8px; padding: 8px 10px 14px; justify-content: center; flex-wrap: nowrap; }
.controls button { flex: 0 1 auto; min-width: 0; padding: 10px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls button.grow { flex: 1 1 0; }
@media (max-width: 380px) { .controls { gap: 6px; padding: 8px 8px 12px; } .controls button { padding: 10px 10px; font-size: 15px; } .controls button.strike { min-width: 84px; } }
button { font: inherit; border: 0; border-radius: 12px; min-height: 48px; padding: 10px 16px; cursor: pointer;
  background: var(--card); color: var(--ink); box-shadow: 0 1px 0 rgba(0,0,0,.25), inset 0 0 0 1px var(--line); }
button.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; font-weight: 650; }
button.strike { background: var(--fire); color: #fff; box-shadow: none; font-weight: 700; min-width: 108px; }
button:disabled { opacity: .45; cursor: default; }
button.hold.active { background: #4a3d16; box-shadow: inset 0 0 0 2px var(--warm); }
/* Preview is held, not tapped: a long press must not select its label (on Android Chrome the selection cancelled the
   touch and ended the preview after about 0.6 s; Samsung lab phone, Nov 9, 2026) */
button.hold { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
.grow { flex: 1; }
.sheet { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; padding: 18px 16px 28px; z-index: 5; }
.sheet h1 { font-size: 22px; margin: 6px 0 12px; }
.sheet h2 { font-size: 18px; margin: 18px 0 8px; }
.sheet p { margin: 8px 0; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin: 10px 0; box-shadow: inset 0 0 0 1px var(--line); }
.likert { display: flex; gap: 6px; justify-content: space-between; margin-top: 8px; }
.likert button { min-height: 44px; min-width: 0; flex: 1; padding: 0; border-radius: 10px; }
.likert button.sel { background: var(--accent); color: #fff; box-shadow: none; }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 4px; }
textarea { width: 100%; min-height: 76px; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #22272c; color: var(--ink); resize: vertical; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; margin: 8px 0; padding: 14px; }
.choice .sym { font-size: 24px; width: 30px; text-align: center; }
.choice .rank { margin-left: auto; font-weight: 700; min-width: 24px; text-align: right; }
.choice.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.banner { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--card); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,.45), inset 0 0 0 1px var(--line); z-index: 4; display: flex; flex-direction: column; gap: 10px; }
.banner .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.banner .msg { font-weight: 650; }
.err { color: var(--bad); font-size: 14px; min-height: 18px; }
.banner .card { margin: 0; padding: 8px 10px; }
.sheet.done h1 { font-size: 19px; margin: 2px 0 8px; }
.sheet.done h2 { font-size: 17px; margin: 10px 0 4px; }
.sheet.done p { margin: 4px 0; }
.sheet.done .card { padding: 10px 12px; margin: 6px 0; }
.sheet.done .choice { padding: 9px 12px; margin: 6px 0; }
.banner textarea { min-height: 52px; }
.banner .err:empty { display: none; }
.small { font-size: 13px; color: var(--muted); }
.ruleimg { display: block; margin: 6px auto 2px; }
.list button { width: 100%; text-align: left; margin: 6px 0; }
pre.rec { white-space: pre-wrap; word-break: break-all; font-size: 11px; background: #22272c; color: var(--ink); padding: 8px; border-radius: 8px; max-height: 260px; overflow: auto; }
.shake { animation: shake .3s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
/* reduced motion: no shake (the reason still shows on the hint line) */
.reduce .shake { animation: none; }
/* neutral touch check: plain shapes only */
.warm p { margin: 4px 0 10px; }
.tapzone { display: flex; justify-content: center; padding: 18px 0; }
button.dot { width: 72px; height: 72px; min-height: 72px; border-radius: 50%; background: var(--accent); box-shadow: none; padding: 0; }
.pad { position: relative; height: 210px; border-radius: 12px; background: #22272c; touch-action: none; overflow: hidden; }
.pad .target { position: absolute; right: 18px; top: 60px; width: 92px; height: 92px; border: 3px dashed var(--muted); border-radius: 12px; }
.pad .token { position: absolute; left: 22px; top: 76px; width: 60px; height: 60px; border-radius: 10px; background: #9aa6b0; touch-action: none; }
.scrollbox { height: 170px; overflow-y: auto; touch-action: pan-y; border-radius: 12px; background: #22272c; padding: 6px 12px; }
.scrollbox .line { padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.scrollbox button { margin: 12px 0 6px; }
/* pairwise choices and the continuation question */
.row { display: flex; gap: 10px; }
.choice.half { flex: 1 1 0; margin: 6px 0 0; padding: 12px; justify-content: center; }
.pair { padding: 10px 12px; }
/* FL-2B additions: the session strip (homes warmed so far), the mute button, the barn answer row */
.strip { display: flex; align-items: center; gap: 8px; padding: 0 14px 4px; min-height: 22px; font-size: 14px; color: var(--muted); }
.strip b { color: var(--warm); font-size: 15px; }
.strip .homes { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.strip .homes i { width: 10px; height: 10px; background: var(--warm); display: inline-block; clip-path: polygon(50% 0, 100% 45%, 85% 45%, 85% 100%, 15% 100%, 15% 45%, 0 45%); }
button.mute { min-height: 36px; min-width: 40px; padding: 4px 8px; font-size: 18px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.controls .row.grow { flex: 1 1 100%; gap: 8px; }
.controls .row.grow .choice.half { margin: 0; padding: 8px 10px; font-size: 14px; min-height: 44px; }
.controls { flex-wrap: wrap; }
</style>

<script>/*
 * FL-2B puzzle engine — ruleset id below. (Participant pages carry no project or brand names.)
 *
 * ONE propagation law, nothing else (docs/fl2b/FL2B_02_BOARD_RULES.md §2):
 *   Fire starts at the fire square. It spreads from a burning square to every FUEL square that
 *   shares a side with it, one step at a time; a fuel square is a placed piece square or a BRUSH
 *   square (natural fuel already on the board). Each square burns once.
 *   A HOME warms when a burning square shares a side with it; homes pass no fire.
 *   A BARN (protected tile) catches fire when a burning square shares a side with it; the strike
 *   then fails, whatever the homes did. Corners never touch.
 *   Success: every home warm and no barn caught.
 *
 * Not present by design: wind, frost of any thickness, timing rules, multi-hit, double-path,
 * branch priority, mid-burn control, economy.
 *
 * The outcome is a pure function of the final set of fuel squares (placed squares plus brush),
 * so placement order cannot matter. Preview, strike animation and result all call burn().
 *
 * Differences from the FL-1 engine (src/engine.ts): the BRUSH and PROTECT cell kinds ('n', 'B'),
 * brush as fuel in burn(), missMarkers() and junctions(), the caught barns in the result, the
 * success rule, and rotate180() for the arm-2 scenes. Everything else is FL-1's, line for line.
 *
 * Loaded as a classic script in the page (global FLE) and with require() in Node.
 */
'use strict';

/** Scene definition as stored in scenes.json. */
                           
                                                                                     
                                      
 
/** Parsed scene. */
                        
                                                                                                                         
                                                
 
                             
                                                                         
                
                                               
                  
                                                 
                  
                                                                  
                                                                                                            
 
                                                                                           
                               

                                                       

const FLE = (function () {
  const RULESET = 'fl2b-rules-r1';
  const SNOW = 0, ROCK = 1, SOURCE = 2, HOME = 3, BRUSH = 4, PROTECT = 5;
  /** Fixed neighbour order N, E, S, W (all tie-breaks depend on it). */
  const DIRS                                           = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  /** Base shapes. Screen coordinates: x right, y down. */
  const PIECE_BASE                        = {
    I2: [[0, 0], [1, 0]],
    I3: [[0, 0], [1, 0], [2, 0]],
    L3: [[0, 0], [0, 1], [1, 1]],
    T4: [[0, 0], [1, 0], [2, 0], [1, 1]],
  };

  function normalize(cells       )        {
    let mx = Infinity, my = Infinity;
    for (const [x, y] of cells) { if (x < mx) mx = x; if (y < my) my = y; }
    const out = cells.map(([x, y]) => [x - mx, y - my]);
    out.sort((a, b) => (a[1] - b[1]) || (a[0] - b[0]));
    return out;
  }
  /** 90 degrees clockwise on screen: right -> down -> left -> up. */
  function rotateCW(cells       )        { return normalize(cells.map(([x, y]) => [-y, x])); }

  /** distinct orientations, cycle order = repeated CW turns */
  const ORIENTS                          = {};
  for (const k of Object.keys(PIECE_BASE)) {
    const list          = [];
    let cur = normalize(PIECE_BASE[k]);
    for (let r = 0; r < 4; r++) {
      const key = JSON.stringify(cur);
      if (!list.some((o) => JSON.stringify(o) === key)) list.push(cur);
      cur = rotateCW(cur);
    }
    ORIENTS[k] = list;
  }
  function pieceSize(type        )         { return PIECE_BASE[type].length; }

  /**
   * Scene definition (JSON):
   *  { id, w, h, grid: string[h] of '.', '#', 'F', 'H', 'n' (brush), 'B' (barn); hand: string[]; laid?: number[] }
   */
  function parseScene(def          )        {
    const w = def.w, h = def.h;
    if (!Array.isArray(def.grid) || def.grid.length !== h) throw new Error('bad grid ' + def.id);
    const cells = new Uint8Array(w * h);
    let source = -1; const homes           = []; const barns           = []; const brush           = [];
    for (let y = 0; y < h; y++) {
      const row = def.grid[y];
      if (row.length !== w) throw new Error('bad row ' + def.id);
      for (let x = 0; x < w; x++) {
        const c = row[x], i = y * w + x;
        if (c === '.') cells[i] = SNOW;
        else if (c === '#') cells[i] = ROCK;
        else if (c === 'F') { cells[i] = SOURCE; if (source >= 0) throw new Error('two fires ' + def.id); source = i; }
        else if (c === 'H') { cells[i] = HOME; homes.push(i); }
        else if (c === 'n') { cells[i] = BRUSH; brush.push(i); }
        else if (c === 'B') { cells[i] = PROTECT; barns.push(i); }
        else throw new Error('bad char ' + c + ' in ' + def.id);
      }
    }
    if (source < 0) throw new Error('no fire ' + def.id);
    const hand = (def.hand || []).slice();
    for (const p of hand) if (!PIECE_BASE[p]) throw new Error('bad piece ' + p);
    const budget = hand.reduce((s, p) => s + pieceSize(p), 0);
    return { id: def.id, w, h, cells, source, homes, barns, brush, hand, budget, def };
  }

  /** side neighbours of cell i, in N,E,S,W order */
  function neighbors(sc       , i        )           {
    const x = i % sc.w, y = (i - x) / sc.w, out           = [];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < sc.w && ny < sc.h) out.push(ny * sc.w + nx);

    return out;
  }

  function emptyFuel(sc       )             { return new Uint8Array(sc.w * sc.h); }
  /** Placed fuel only (brush is in the scene, not in the fuel set). */
  function fuelFrom(sc       , list                  )             {
    const f = emptyFuel(sc);
    for (const i of list) {
      if (sc.cells[i] !== SNOW) throw new Error('fuel on non-snow cell ' + i + ' in ' + sc.id);
      f[i] = 1;
    }
    return f;
  }
  function fuelList(fuel                   )           { const out           = []; for (let i = 0; i < fuel.length; i++) if (fuel[i]) out.push(i); return out; }
  function fuelCount(fuel                   )         { let n = 0; for (let i = 0; i < fuel.length; i++) n += fuel[i]; return n; }
  /** Is square i something the fire spreads through: a placed square on snow, or brush. */
  function burns(sc       , fuel                   , i        )          { return (sc.cells[i] === SNOW && !!fuel[i]) || sc.cells[i] === BRUSH; }

  /**
   * THE propagation law. Pure function of (scene, final placed-fuel set); brush comes from the scene.
   * t[i] = step at which square i is burning (fire square = 0), -1 if never.
   * homeT[k] = step at which home k warms (one step after a side-neighbour burns), -1 if cold.
   * barnT[k] = step at which barn k catches (one step after a side-neighbour burns), -1 if safe.
   */
  function burn(sc       , fuel                   )             {
    const n = sc.w * sc.h;
    const t = new Int16Array(n).fill(-1);
    t[sc.source] = 0;
    const q = [sc.source];
    for (let qi = 0; qi < q.length; qi++) {
      const c = q[qi];
      for (const nb of neighbors(sc, c)) {
        if (burns(sc, fuel, nb) && t[nb] < 0) { t[nb] = t[c] + 1; q.push(nb); }
      }
    }
    const touchT = (cell        )         => {
      let best = -1;
      for (const nb of neighbors(sc, cell)) {
        if (t[nb] >= 0) { const v = t[nb] + 1; if (best < 0 || v < best) best = v; }
      }
      return best;
    };
    const homeT = sc.homes.map(touchT);
    const barnT = sc.barns.map(touchT);
    const warm           = [], cold           = [], caught           = [];
    homeT.forEach((v, k) => (v >= 0 ? warm : cold).push(k));
    barnT.forEach((v, k) => { if (v >= 0) caught.push(k); });
    let steps = 0, burnt = 0, unburnt = 0, brushBurnt = 0, brushUnburnt = 0;
    for (let i = 0; i < n; i++) {
      if (t[i] > steps) steps = t[i];
      if (sc.cells[i] === BRUSH) { if (t[i] >= 0) brushBurnt++; else brushUnburnt++; }
      else if (fuel[i]) { if (t[i] >= 0) burnt++; else unburnt++; }
    }
    for (const v of homeT) if (v > steps) steps = v;
    for (const v of barnT) if (v > steps) steps = v;
    const safe = caught.length === 0;
    return { t, homeT, barnT, warm, cold, caught, safe, steps, burnt, unburnt, brushBurnt, brushUnburnt, success: cold.length === 0 && safe };
  }

  /**
   * After a miss: for every cold home, where the fire stopped (endpoint) and the first
   * square where a connection is missing (gap). 0-1 BFS from all burning squares
   * through snow (cost 1), unburnt placed fuel (cost 0) and unburnt brush (cost 0) to a square
   * beside the home. Barns and rock are never crossed. Deterministic: starts in index order,
   * neighbours N,E,S,W. Says nothing about a caught barn (the result shows that itself).
   */
  function missMarkers(sc       , fuel                   , b            )               {
    const res               = [];
    const crossable = (i        )          => sc.cells[i] === SNOW || sc.cells[i] === BRUSH;
    for (const k of b.cold) {
      const hm = sc.homes[k];
      const targets = new Set(neighbors(sc, hm).filter(crossable));
      const n = sc.w * sc.h;
      const dist = new Int32Array(n).fill(1 << 29);
      const par = new Int32Array(n).fill(-1);
      const dq           = [];
      for (let i = 0; i < n; i++) if (b.t[i] >= 0) { dist[i] = 0; dq.push(i); }
      let head = 0; const front           = [];
      let found = -1;
      // simple 0-1 BFS with a front stack and a back queue
      const popNext = ()         => (front.length ? (front.pop()          ) : (head < dq.length ? dq[head++] : -1));
      const done = new Uint8Array(n);
      for (;;) {
        const c = popNext();
        if (c < 0) break;
        if (done[c]) continue;
        done[c] = 1;
        if (targets.has(c) && b.t[c] < 0) { found = c; break; }
        for (const nb of neighbors(sc, c)) {
          if (!crossable(nb) || b.t[nb] >= 0 || done[nb]) continue;
          const w = burns(sc, fuel, nb) ? 0 : 1;
          if (dist[c] + w < dist[nb]) {
            dist[nb] = dist[c] + w; par[nb] = c;
            if (w === 0) front.push(nb); else dq.push(nb);
          }
        }
      }
      if (found < 0) { res.push({ home: k, endpoint: -1, gap: -1, path: [] }); continue; }
      const path           = [];
      for (let c = found; c >= 0; c = par[c]) path.push(c);
      path.reverse();
      const endpoint = path[0];
      const gap = path.find((c) => b.t[c] < 0 && !burns(sc, fuel, c));
      res.push({ home: k, endpoint, gap: gap === undefined ? -1 : gap, path });
    }
    return res;
  }

  /** Cells of a piece placement (orientation index o, anchor x,y = top-left of orientation box). */
  function placementCells(type        , o        , x        , y        )        {
    const ori = ORIENTS[type][o % ORIENTS[type].length];
    return ori.map(([dx, dy]) => [x + dx, y + dy]);
  }
  /** occ: piece id per cell or -1. Pieces go on snow only (never on brush or a barn). */
  function canPlace(sc       , occ                   , cellsXY       , ignoreId         )          {
    for (const [x, y] of cellsXY) {
      if (x < 0 || y < 0 || x >= sc.w || y >= sc.h) return false;
      const i = y * sc.w + x;
      if (sc.cells[i] !== SNOW) return false;
      if (occ[i] >= 0 && occ[i] !== ignoreId) return false;
    }
    return true;
  }
  /** Junction squares: fuel squares (placed or brush) with 3 or more side contacts among fuel, brush and the fire (homes and barns do not count). */
  function junctions(sc       , fuel                   )           {
    const out           = [];
    for (let i = 0; i < fuel.length; i++) {
      if (!burns(sc, fuel, i)) continue;
      let k = 0;
      for (const nb of neighbors(sc, i)) if (burns(sc, fuel, nb) || sc.cells[nb] === SOURCE) k++;
      if (k >= 3) out.push(i);
    }
    return out;
  }
  /** Canonical structure key: sorted placed-fuel indices joined by commas. */
  function structureKey(fuel                   )         { return fuelList(fuel).join(','); }

  /** The same board turned by 180 degrees (cell i -> w*h-1-i); used for the arm-2 scenes. The hand is unchanged. */
  function rotate180(def          )           {
    const grid = def.grid.slice().reverse().map((row) => row.split('').reverse().join(''));
    const n = def.w * def.h;
    const laid = (def.laid || []).map((i) => n - 1 - i).sort((a, b) => a - b);
    return { ...def, grid, laid };
  }
  /** Index map of rotate180 and its inverse (the same map). */
  function rot180Index(w        , h        , i        )         { return w * h - 1 - i; }

  return {
    RULESET, SNOW, ROCK, SOURCE, HOME, BRUSH, PROTECT, DIRS, PIECE_BASE, ORIENTS,
    normalize, rotateCW, pieceSize, parseScene, neighbors, emptyFuel, fuelFrom, fuelList, fuelCount, burns,
    burn, missMarkers, placementCells, canPlace, junctions, structureKey, rotate180, rot180Index,
  };
})();
                                

if (typeof module === 'object' && module && module.exports) module.exports = FLE;
else (globalThis       ).FLE = FLE;

<script>/*
 * FL-2B board model: the only code that changes a scene's board. The page sends every board action
 * through apply() and records it in the scene's input log; the replay tool runs the same apply() on
 * a recorded log and must reach the same state hash.
 *
 * An action is a short array, [name, ...arguments]:
 *   A (pieces)   ['tturn', id]          turn a piece in the tray (not a board change, not undoable)
 *                ['place', id, x, y]    tray piece onto the board, top-left of its box at x,y, as turned
 *                ['move', id, x, y]     a piece on the board to x,y
 *                ['bturn', id]          turn a piece on the board in place (nudged by one square if needed)
 *                ['unplace', id]        a piece on the board back to the tray
 *                ['undo']               reverse the last board change
 *   all          ['strike', predicted, barn]
 *                                       burn the structure; predicted = homes the player marked (sorted indices)
 *                                       or null when no prediction was asked; barn = the player's answer to
 *                                       "Will the barn catch fire?" (true/false) in a probe with a barn, else null
 *                ['end', outcome]       the scene ends (solved, skipped, timeUp, probe; quit = Finish now in the optional board)
 * Anything else, or an action that is not legal in the current state, is refused and changes nothing.
 * FL-1's drawing actions (stroke, erase), the probe change (toggle) and the replay offer are not in FL-2B.
 * Loaded as a classic script in the page (global FLM) and with require() in Node.
 */
'use strict';
                                                 
                                             

                             
                                                                                                     
                                                                                                                                                                                              
                        
                                                                        
                                    
                  
                    
                         
                                  
            
 
                                                                        
                                                                              

                                                       
                                               

const FLM = (function (E        , H           ) {
  const SCHEMA = 'fl2b-state-1';
  const UNDO_CAP = 60;
  const OUTCOMES = ['solved', 'skipped', 'timeUp', 'probe', 'quit'];
  /** Where a turned piece may go if it does not fit in place: centre first, then one square N, E, S, W. */
  const NUDGE                                           = [[0, 0], [0, -1], [1, 0], [0, 1], [-1, 0]];

  function newBoard(sc       , cond      , sid        , sceneHash        , laid          )        {
    const b        = { sid, sceneHash, cond, sc, laid: laid.slice(), pieces: [], fuel: E.emptyFuel(sc), undo: [], strikes: [], outcome: null, n: 0 };
    if (cond === 'A') b.pieces = sc.hand.map((type, id) => ({ id, type, o: 0, x: 0, y: 0, placed: false }));
    if (cond === 'P') b.fuel = E.fuelFrom(sc, laid);
    return b;
  }

  function occupancy(b       , ignoreId        )             {
    const occ = new Int16Array(b.sc.w * b.sc.h).fill(-1);
    for (const p of b.pieces) if (p.placed && p.id !== ignoreId) for (const [x, y] of E.placementCells(p.type, p.o, p.x, p.y)) occ[y * b.sc.w + x] = p.id;
    return occ;
  }
  /** The placed-fuel set the burn uses: placed pieces in A, the given structure in a probe. Brush is in the scene. */
  function fuelOf(b       )             {
    if (b.cond !== 'A') return b.fuel;
    const f = E.emptyFuel(b.sc);
    for (const p of b.pieces) if (p.placed) for (const [x, y] of E.placementCells(p.type, p.o, p.x, p.y)) f[y * b.sc.w + x] = 1;
    return f;
  }
  function dims(cells            )                   { let w = 0, h = 0; for (const [x, y] of cells) { if (x + 1 > w) w = x + 1; if (y + 1 > h) h = y + 1; } return [w, h]; }
  function orients(type        )               { return E.ORIENTS[type]; }

  /** Where a turn of a placed piece lands (the same rule the page shows while turning), or null. */
  function boardTurn(b       , p       )                                             {
    const n = orients(p.type).length;
    if (n === 1) return null;
    const no = (p.o + 1) % n;
    const [w0, h0] = dims(orients(p.type)[p.o % n]); const [w1, h1] = dims(orients(p.type)[no]);
    const cx = p.x + (w0 - 1) / 2, cy = p.y + (h0 - 1) / 2;
    const bx = Math.floor(cx - (w1 - 1) / 2 + 0.5), by = Math.floor(cy - (h1 - 1) / 2 + 0.5);
    const occ = occupancy(b, p.id);
    for (const [dx, dy] of NUDGE) {
      const cells = E.placementCells(p.type, no, bx + dx, by + dy);

  function apply(b       , a        )              {

    if (b.outcome !== null) return no('scene already ended');

    const A = b.cond === 'A', P = b.cond === 'P';
    const piece = (v         )               => (A && isInt(v) && v >= 0 && v < b.pieces.length ? b.pieces[v] : null);
    switch (name) {
      case 'tturn': {
        if (a.length !== 2) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        if (p.placed) return no('piece is on the board');
        const n = orients(p.type).length; if (n === 1) return no('piece does not turn');
        p.o = (p.o + 1) % n; return { ok: true };
      }
      case 'place': case 'move': {
        if (a.length !== 4) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        const x = a[2], y = a[3]; if (!isInt(x) || !isInt(y)) return no('bad position');
        if ((name === 'place') === p.placed) return no(name === 'place' ? 'piece is already on the board' : 'piece is not on the board');
        const cells = E.placementCells(p.type, p.o, x, y);
        if (!E.canPlace(b.sc, occupancy(b, p.id), cells, p.id)) return no('does not fit there');
        pushUndo(b, snapPieces(b));
        p.placed = true; p.x = x; p.y = y; return { ok: true };
      }
      case 'bturn': {
        if (a.length !== 2) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        if (!p.placed) return no('piece is not on the board');
        const t = boardTurn(b, p); if (!t) return no('no room to turn');
        pushUndo(b, snapPieces(b));
        p.o = t.o; p.x = t.x; p.y = t.y; return { ok: true };
      }
      case 'unplace': {
        if (a.length !== 2) return no('arguments');
        const p = piece(a[1]); if (!p) return no('no such piece');
        if (!p.placed) return no('piece is not on the board');
        pushUndo(b, snapPieces(b));
        p.placed = false; return { ok: true };
      }
      case 'undo': {
        if (!A) return no('nothing to undo here');
        if (a.length !== 1) return no('arguments');
        const s = b.undo.pop(); if (!s) return no('nothing to undo');
        // a piece that stays in the tray keeps the way it was turned

  /** Canonical state: everything the board and its outcomes depend on, in a fixed order. */
  function canonical(b       )          {

      pieces: b.cond === 'A' ? b.pieces.map((p) => [p.id, p.type, p.o, p.placed ? 1 : 0, p.placed ? p.x : -1, p.placed ? p.y : -1]) : null,

  function logHash(actions          )         { return H.sha256Hex(JSON.stringify(actions)); }

  /** Rebuild a board from its log. Stops at the first refused action. */
  function replayLog(sc       , cond      , sid        , sceneHash        , laid          , actions          )                                                     {
    const b = newBoard(sc, cond, sid, sceneHash, laid);
    for (let k = 0; k < actions.length; k++) {
      const r = apply(b, actions[k]);
      if (!r.ok) return { board: b, error: 'action ' + k + ' (' + JSON.stringify(actions[k]) + ') refused: ' + r.reason, at: k };

else (globalThis       ).FLM = FLM;

<script>/*
 * FL-2B shared page basics: address flags, timing constants, the frozen participant text, and small DOM helpers.
 * REVIEW BUILD: no network code; the page's Content-Security-Policy blocks all connections. HOSTED BUILD: only the
 * ui_hosted module talks to the network (the receiver, after consent); the policy allows the receiver's hosts only.
 * Arms: B = BUDGET (fixed tray of pieces, fixed strike, homes, rock), S = STAKES (the same geometry plus brush and
 * barns). The participant sees "version 1" and "version 2" in play order; the arm names never appear on the page.
 * Every Preview, burn and result calls FLE.burn() on the same final placed-fuel set (brush is in the scene).
 * One of the page modules (load order: ui_common, ui_record, [ui_hosted], ui_render, ui_preview, ui_input, ui_scene,
 * ui_testhooks, ui_flow). Modules share nothing but window.FL2B_UI: functions from another module are called through
 * it when they run, constants come from modules loaded earlier, and the shared state (RUN, FLOW, stepIdx, FROZEN, T0)
 * lives on it.
 */
'use strict';
(function () {
  const W = window       ;
  const U = (W.FL2B_UI = {})       ;
  U.RUN = null; // the board or probe on screen (ui_scene)
  U.FLOW = []; U.stepIdx = 0; // the participant flow and its current step (ui_flow)
  const ev = (...a       ) => U.ev(...a);
  const FLE = W.FLE, FLM = W.FLM, DATA = W.FL2B_SCENES, BUILD = W.FL2B_BUILD;
  const HOSTED_PAGE = !!W.FL2BH_CONFIG;
  // hosted: the address steers the slot only; test, dev, fast, resume and motion flags are ignored
  const QS = HOSTED_PAGE
    ? (() => { const q = new URLSearchParams(location.search), s = q.get('slot'); return new URLSearchParams(s === null ? '' : 'slot=' + encodeURIComponent(s)); })()
    : new URLSearchParams(location.search);
  const TEST = QS.get('test') === '1';
  const DEV = TEST || QS.get('dev') === '1';
  const FAST = TEST && QS.get('fast') === '1';
  const RESUME = !TEST || QS.get('resume') === '1'; // tests opt in to resuming with &resume=1
  const STEP_MS = FAST ? 8 : 140;
  const TAIL_MS = FAST ? 20 : 650;
  const SKIP_AFTER_MS = 150000, SKIP_AFTER_TRIES = 4, TEACH_SKIP_MS = 90000, TEACH_SKIP_TRIES = 3;
  const ARM_ALLOWANCE_MS = 10 * 60000; // visible time per arm (protocol §4, reading 3)
  const STORE_KEY = 'fl2b-progress';
  const SAVE_EVERY_TICKS = 8; // 8 x 250 ms: the running board is saved at least every 2 s
  const REFUSAL_MS = 700;
  // reduced motion (the phone's setting, or &motion=reduce): no flicker and no shake; the burn still advances
  // one wave per step at the same speed in both arms, so outcome timing does not change
  const REDUCED = QS.get('motion') === 'reduce' || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const IDLE_MS = 10000; // visible time with no touch for longer than this counts as idle
  const PTR_CAP = 4000; // pointer entries kept per board

  /* ------------------------------------------------------------------ text (frozen) */
  /** The two arms. `pos` labels come from the play order; nothing on the page says budget, stakes, brush rule or barn rule beyond these lines. */
  const ARM = {
    B: { key: 'B', card: 'Use the pieces in the tray to carry the fire to every home, then strike.', reminder: 'Carry the fire to every home.' },
    S: { key: 'S', card: 'Dry brush on the ground burns too. The barn must not catch fire.', reminder: 'Brush burns too. The barn must not catch fire.' },
  };
  const POS = ['Version 1', 'Version 2'];
  const TXT = {
    teachHint: 'Drag a piece onto the snow. <b>Tap a piece to turn it.</b>',
    teachTurn: 'The piece is lying the wrong way. <b>Tap the piece to turn it.</b>',
    teachBarn: 'Fire touching the barn’s side sets it alight. <b>Find another way round</b> — brush burns too.',
    previewLine: 'Hold <b>Preview</b> to see what will burn.',
    mainHint: { B: 'Build a path of fuel from the fire to every home.', S: 'Build a path of fuel from the fire to every home. The barn must not catch fire.' },
    success: 'Every home is warm.',
    miss: 'Not every home is warm.',
    barn: 'The barn caught fire.',
    barnAndMiss: 'The barn caught fire, and not every home is warm.',
    dropFail: 'A piece only fits on empty snow.',
    turnFail: 'No room to turn it here.',
    timeUp: 'Time for this version is up.',
    probePredict: 'What do you think will happen? <b>Tap the homes</b> you think will warm.',
    probeBarn: 'Will the barn catch fire?',
    probeReady: 'Tap <b>Strike</b> when you are ready.',
    why: 'Why did that happen?',
    strip: 'Homes warmed so far',
  };

  const app = (document.getElementById('app')               );
  /* ------------------------------------------------------------------ helpers */
  function h(tag        , attrs      , ...kids       )              {
    const e = document.createElement(tag);
    if (attrs) for (const k of Object.keys(attrs)) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  }
  function clear() { app.innerHTML = ''; }
  function sheet(...kids) { clear(); const s = h('div', { class: 'sheet' }, ...kids); app.append(s); s.scrollTop = 0; return s; }
  /** "Version 1" / "Version 2": the arm's label by its position in this participant's play order. */
  function armLabel(armKey) { const order = (U.REC && U.REC.order) || 'BS'; const k = order.indexOf(armKey); return POS[k < 0 ? 0 : k]; }

  function likert(id, label, lo, hi, store) {
    const wrap = h('div', { class: 'card' }, h('div', null, label));
    const row = h('div', { class: 'likert', role: 'radiogroup', 'aria-label': label });
    for (let v = 1; v <= 7; v++) {
      const b = h('button', { type: 'button', 'data-v': v, onclick: () => { store[id] = v; [...row.children].forEach((x) => x.classList.toggle('sel', x === b)); ev('likert', [id, v]); } }, String(v));
      row.append(b);
    }
    wrap.append(row, h('div', { class: 'ends' }, h('span', null, lo), h('span', null, hi)));
    return wrap;
  }
  function textQ(id, label, store, required          ) {
    const ta = (h('textarea', { 'data-q': id, maxlength: '600', 'aria-label': label })                       );
    ta.addEventListener('input', () => { store[id] = ta.value; });
    return h('div', { class: 'card' }, h('div', null, label + (required ? '' : ' (optional)')), ta);
  }
  function validText(s) { return typeof s === 'string' && s.trim().length >= 2; }

  Object.assign(U, { FLE, FLM, DATA, BUILD, QS, TEST, DEV, RESUME, HOSTED_PAGE, STEP_MS, TAIL_MS, SKIP_AFTER_MS, SKIP_AFTER_TRIES, TEACH_SKIP_MS, TEACH_SKIP_TRIES, ARM_ALLOWANCE_MS, STORE_KEY, SAVE_EVERY_TICKS, REFUSAL_MS, REDUCED, IDLE_MS, PTR_CAP, ARM, POS, TXT, app, h, clear, sheet, armLabel, likert, textQ, validText });
})();

<script>/*
 * FL-2B instrumentation: the session record (schema fl2b-record-1), events, errors, the pointer log, and where
 * progress is kept for a reload.
 * One of the page modules (load order: ui_common, ui_record, [ui_hosted], ui_render, ui_preview, ui_input, ui_scene,
 * ui_testhooks, ui_flow). Modules share nothing but window.FL2B_UI.
 */
'use strict';
(function () {
  const W = window       ;
  const U = W.FL2B_UI;
  const { BUILD, DATA, DEV, FLE, HOSTED_PAGE, PTR_CAP, REDUCED, STORE_KEY, TEST } = U;
  const cellAt = (...a       ) => U.cellAt(...a);
  const deviceLine = (...a       ) => U.deviceLine(...a);
  const liveState = (...a       ) => U.liveState(...a);
  const updateG3 = (...a       ) => U.updateG3(...a);
  /* ------------------------------------------------------------------ progress kept for a reload */
  /**
   * Review page: the session is kept in this tab's session storage (or the tab's window name when a page opened
   * from a file has no storage); nothing leaves the tab. Hosted page: the session is kept in local storage of the
   * study's own origin, so reopening the original link in this browser resumes it after the tab was closed;
   * ui_hosted uploads it to the receiver. If storage is refused, the tab's window name is used (ui_hosted then stops
   * before consent: the study needs storage).
   */
  const STORE = (() => {
    try {
      const k = STORE_KEY + '-check';
      if (HOSTED_PAGE) {
        localStorage.setItem(k, '1'); localStorage.removeItem(k);
        return { kind: 'local', get: ()                => localStorage.getItem(STORE_KEY), set: (v        ) => localStorage.setItem(STORE_KEY, v) };
      }
      sessionStorage.setItem(k, '1'); sessionStorage.removeItem(k);
      return { kind: 'session', get: ()                => sessionStorage.getItem(STORE_KEY), set: (v        ) => sessionStorage.setItem(STORE_KEY, v) };
    } catch (e) {
      const P = STORE_KEY + ':';
      return { kind: 'tab', get: ()                => (String(window.name || '').startsWith(P) ? String(window.name).slice(P.length) : null), set: (v        ) => { window.name = P + v; } };
    }
  })();

  /* ------------------------------------------------------------------ record */
  U.T0 = Date.now(); // absolute time base; a resumed session keeps the original one
  /** An anonymous random session id: it identifies the session record, nothing else. */
  function newSessionId() {
    try { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, (x) => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { return Math.floor(Math.random() * 2 ** 52).toString(16).padStart(13, '0'); }
  }
  const EMPTY = () => ({
    session: newSessionId(), slot: null, order: null, sym: null, pairSide: null, optList: null,
    t0: U.T0, startedAt: new Date(U.T0).toISOString(), steps: [], scenes: [], probes: [], cur: null,
    answers: {}, pairwise: null, meaning: null, warmed: 0, mute: false, muteLog: [], g3: null, completed: false, resumes: [], errors: [], events: [],
  });
  const REC      = Object.assign({
    schema: 'fl2b-record-1', build: BUILD.id, ruleset: FLE.RULESET, scenesHash: DATA.scenesHash,
    mode: HOSTED_PAGE ? 'hosted' : TEST ? 'test' : DEV ? 'dev' : 'owner-local', device: deviceInfo(),
  }, EMPTY());
  /** A new slot session always starts from an empty record (owner free play beforehand leaves no trace in it). */
  function resetRecord() {
    U.T0 = Date.now();
    Object.assign(REC, EMPTY());
    delete REC.consent; delete REC.finishedAt;
  }
  function now() { return Date.now() - U.T0; }
  function ev(type        , data      ) { REC.events.push([now(), type, data === undefined ? 0 : data]); }
  /** Coarse device facts only: no model name and no full browser string. */
  function deviceInfo() {
    const ua = navigator.userAgent || '';
    const m = (re) => { const r = ua.match(re); return r ? r[1] : null; };
    const and = m(/Android (\d+)/), ios = m(/(?:iPhone|iPad|iPod).*? OS (\d+)_/);
    const os = and ? 'Android ' + and : ios ? 'iOS ' + ios : /Windows/.test(ua) ? 'Windows' : /CrOS/.test(ua) ? 'ChromeOS' : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : 'other';
    const edg = m(/Edg[A-Za-z]*\/(\d+)/), sam = m(/SamsungBrowser\/(\d+)/), ff = m(/(?:Firefox|FxiOS)\/(\d+)/), cr = m(/(?:Chrome|CriOS)\/(\d+)/), sf = m(/Version\/(\d+)[\d.]* (?:Mobile\/\S+ )?Safari/);
    const browser = edg ? 'Edge ' + edg : sam ? 'Samsung Internet ' + sam : ff ? 'Firefox ' + ff : cr ? 'Chrome ' + cr : sf ? 'Safari ' + sf : 'other';
    return { vw: innerWidth, vh: innerHeight, dpr: devicePixelRatio || 1, touch: 'ontouchstart' in window || navigator.maxTouchPoints > 0, os, browser, reducedMotion: REDUCED, store: STORE.kind }                       ;
  }
  // Chrome's reduced browser string freezes the Android version; ask for the real OS version only (no model)
  try {
    const uad = (navigator       ).userAgentData;
    if (uad && uad.getHighEntropyValues) uad.getHighEntropyValues(['platformVersion']).then((v) => {
      REC.device.platform = v.platform; REC.device.platformVersion = v.platformVersion;
      const el = document.getElementById('deviceLine'); if (el) el.textContent = deviceLine();
    }, () => {});
  } catch (e) { /* not available */ }
  /** Errors are kept as categories with the step and scene, never as raw messages. */
  function logError(cat) {
    try {
      if (!REC.errors) REC.errors = [];
      if (REC.errors.length < 50) REC.errors.push([now(), cat, U.FLOW[U.stepIdx] ? U.FLOW[U.stepIdx].kind : '', U.RUN && U.RUN.def ? U.RUN.def.id : '']);
      ev('error', cat); save();
    } catch (e) { /* never let logging break the page */ }
  }
  addEventListener('error', () => logError('script-error'));
  addEventListener('unhandledrejection', () => logError('promise-rejection'));
  // leaving and returning is logged on every screen, not only during boards (until the record is final)
  document.addEventListener('visibilitychange', () => { if (U.FROZEN) return; ev('vis', document.visibilityState); if (U.RUN) U.RUN.lastTick = performance.now(); save(); });
  /** After "All done" or "I do not agree" the stored record is final: nothing more is written. */
  U.FROZEN = false;
  function freezeRecord() { save(); U.FROZEN = true; }
  function save() {
    if (U.FROZEN) return;
    if (U.RUN && !U.RUN.dead && !U.RUN.ended) { U.RUN.rec.live = liveState(U.RUN); if (U.RUN.st.g3) updateG3(U.RUN); }
    try { STORE.set(JSON.stringify({ rec: REC, stepIdx: U.stepIdx, slot: REC.slot })); } catch (e) { /* storage refused: play continues */ }
  }

  function storedSession() { try { return JSON.parse(STORE.get() || 'null'); } catch (e) { return null; } }
  /** Pointer log: down, cell changes while held, up, cancel, extra finger; the board square under the finger. */
  function plog(run, type, p) {
    const c = cellAt(run, p.x, p.y);
    run.lastInput = performance.now();
    if (type === 'm' && c === run.lastPtrCell) return;
    run.lastPtrCell = type === 'u' || type === 'c' ? -2 : c;
    const L = run.rec.ptr; if (L && L.length < PTR_CAP) L.push([Math.round(now()), type, c]);
  }

  Object.assign(U, { STORE, REC, resetRecord, now, ev, logError, freezeRecord, save, storedSession, plog, deviceInfo });
})();
</script>
<script>/*
 * Hosted study shell (FL-1-R1-H1, shell fl2bh-2 with the H2L pre-consent correction). In the hosted participant page only,
 * never in the review page. It adds what the hosted stage needs around the game and flow, and nothing else:
 *   - the Android Google Chrome gate, before consent and again at "I agree" (nothing is stored or sent for a refused browser);
 *   - the invitation credential taken from the link fragment (the page's first script moves it out of the address);
 *   - consent before the session: until "I agree" the page keeps only the invitation (this tab) and the one-tab lock, and
 *     holds no study record, assignment, step or clock; nothing is stored for the study and nothing is sent;
 *   - at "I agree", the session begins (new record, assignment, clock and device facts, the consent step and consent), then
 *     this browser's session {gs, rc} and the first record, whose verified receipt binds the invitation and must arrive
 *     before the touch check begins (the receiver checks slot, order, rotation and lists against the frozen table);
 *   - "I do not agree": nothing is sent and no record is kept; a minimal local guard (the invitation's fingerprint only)
 *     shows the declined screen again if the same link is reopened in this browser;
 *   - the record uploaded at every step and scene end, every few seconds after the completion code is shown, when the page
 *     is hidden, and as the final record at Finish; each upload counts only when the readback returns its exact digest;
 *   - the completion code shown where the review page shows TEST-ONLY, only after the receiver verified a completed record;

 *     original link resumes it.

  try { delete W.__fl2bh; } catch (e) { W.__fl2bh = undefined; }
  const K_CRED = 'fl2bh-k', K_GRANT = 'fl2bh-g', K_META = 'fl2bh-m', K_OUT = 'fl2bh-o', K_LOCK = 'fl2bh-lock', K_TAB = 'fl2bh-tab', K_DECL = 'fl2bh-d';

  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };

  const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } };

    try {
      const t = 'fl2bh-t'; localStorage.setItem(t, '1'); localStorage.removeItem(t); sessionStorage.setItem(t, '1'); sessionStorage.removeItem(t);

    tab: null, lockT: null };

  function clearLocal() { [K_META, K_OUT, K_GRANT, U.STORE_KEY].forEach(lsDel); ssDel(K_GRANT); }
  function forget() { ssDel(K_CRED); ST.k = null; }

  /* ------------------------------------------------------------------ eligibility gate (as accepted for Firestorm CV-1R) */
  /** Only the Google Chrome app on an Android phone: the browser string AND the browser's own client hints must both say so. */
  function androidChrome() {
    const ua = navigator.userAgent || '', d = (navigator       ).userAgentData || null;

<script>/*
 * FL-2B renderer: draws the board (snow, rock, brush, barns, homes, fire), the placed fuel, the burn, Preview, the
 * miss marks and the tray on the canvas. It reads the scene and never changes the board or the record; it only notes
 * what it drew (run.drawn), which the parity test reads.

 * ui_testhooks, ui_flow). Modules share nothing but window.FL2B_UI.

'use strict';

    home: '#5c6b78', homeWarm: '#9a6b2f', window: '#3a4550', windowWarm: '#ffd43b', fire: '#f06a1d', flame: '#ffd43b', ok: '#2f9e44', bad: '#e03131', cold: '#4a90d9', refuse: '#7048e8',
    brush: '#d9c27a', brushEdge: '#a8903f', brushTwig: '#8a7430', barn: '#9b3b2e', barnRoof: '#5a1f16', barnDoor: '#3b1410', barnSafe: '#2f9e44' };

    if (pv && !pv.success && pv.cold.length) { const pm = FLE.missMarkers(sc, fuel, pv).map((m) => ({ home: m.home, endpoint: m.endpoint, gap: -1 })); drawMarkers(ctx, g, pm); drawn.markers = pm.map((m) => [m.home, m.endpoint, m.gap]); }
    if (b && a.done && run.markers) { drawMarkers(ctx, g, run.markers); if (!pv) drawn.markers = run.markers.map((m) => [m.home, m.endpoint, m.gap]); }

  Object.assign(U, { draw, COL });
})();

<script>/*
 * Preview: holding Preview shows what the same burn() would do now; releasing it, or lifting a finger anywhere, ends it.
 * One of the page modules (load order: ui_common, ui_record, [ui_hosted], ui_render, ui_preview, ui_input, ui_scene, ui_testhooks, ui_flow). Modules share
 * nothing but window.FL2B_UI: functions from another module are called through it when they run, constants
 * come from modules loaded earlier, and the shared state (RUN, FLOW, stepIdx, FROZEN, T0) lives on it.
 */
'use strict';
(function () {
  const W = window       ;
  const U = W.FL2B_UI;
  const draw = (...a       ) => U.draw(...a);
  const ev = (...a       ) => U.ev(...a);
  const firstAction = (...a       ) => U.firstAction(...a);
  const renderControls = (...a       ) => U.renderControls(...a);
  /* ---------- preview (same burn() as the strike) */
  function previewOn(run) {
    if (run.phase !== 'edit' || run.preview) return;
    run.preview = true; run.previewStart = performance.now(); run.rec.previewCount++;
    ev('pvOn'); firstAction(run); draw(run);
  }
  function previewOff(run) {
    if (!run.preview) return;
    run.preview = false; const d = performance.now() - run.previewStart; run.rec.previewMs += Math.round(d);
    ev('pvOff', Math.round(d)); draw(run);
  }
  // safety: a finger lifted anywhere ends a held Preview
  document.addEventListener('pointerup', () => { if (U.RUN && U.RUN.preview) { previewOff(U.RUN); renderControls(U.RUN); } }, true);
  document.addEventListener('pointercancel', () => { if (U.RUN && U.RUN.preview) { previewOff(U.RUN); renderControls(U.RUN); } }, true);

  Object.assign(U, { previewOn, previewOff });
})();
</script>
<script>/*
 * FL-2B input: pointer and touch handling for the pieces and the probe predictions; board changes go only through

 * One of the page modules (load order: ui_common, ui_record, [ui_hosted], ui_render, ui_preview, ui_input, ui_scene,
 * ui_testhooks, ui_flow). Modules share nothing but window.FL2B_UI.

<script>/*

 * ui_testhooks, ui_flow). Modules share nothing but window.FL2B_UI.

  const ev = (...a       ) => U.ev(...a);
  const freezeRecord = (...a       ) => U.freezeRecord(...a);
  const h = (...a       ) => U.h(...a);
  const likert = (...a       ) => U.likert(...a);
  const now = (...a       ) => U.now(...a);

  const save = (...a       ) => U.save(...a);

  const storedSession = (...a       ) => U.storedSession(...a);
  const teardownScene = (...a       ) => U.teardownScene(...a);

    );

    const err = h('div', { class: 'err' });

    const t0 = now();
    const res                      = { t0, tapMs: null, dragMs: null, dragMisses: 0, scrollMs: null, scrolled: false, pointerType: null };
    const task = h('div', { class: 'card warm', id: 'warmTask' });
    const doneTask = () => { REC.warmup = res; ev('warmup', [res.tapMs, res.dragMs, res.scrollMs]); next(); };
    const stepScroll = () => {
      task.innerHTML = '';
      const box = h('div', { class: 'scrollbox', id: 'warmScroll' });
      for (let k = 1; k <= 14; k++) box.append(h('div', { class: 'line' }, 'Line ' + k));
      const cont = h('button', { class: 'primary', id: 'warmScrollDone', style: 'width:100%', onclick: () => {
        res.scrollMs = now() - t0; res.scrolled = box.scrollTop > 0; doneTask();
      } }, 'Continue');
      box.append(cont);
      task.append(h('p', null, '3 of 3 · Scroll this list to the end, then tap Continue.'), box);
    };
    const stepDrag = () => {
      task.innerHTML = '';
      const pad = h('div', { class: 'pad', id: 'warmPad' });
      const target = h('div', { class: 'target', id: 'warmTarget' });
      const token = h('div', { class: 'token', id: 'warmToken' });
      pad.append(target, token);
      let drag = null;
      token.addEventListener('pointerdown', (e) => { e.preventDefault(); try { token.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } drag = { x: e.clientX, y: e.clientY }; res.pointerType = res.pointerType || e.pointerType; });
      token.addEventListener('pointermove', (e) => { if (drag) token.style.transform = 'translate(' + (e.clientX - drag.x) + 'px,' + (e.clientY - drag.y) + 'px)'; });
      const drop = () => {
        if (!drag) return; drag = null;
        const a = token.getBoundingClientRect(), b = target.getBoundingClientRect();
        const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
        if (cx > b.left && cx < b.right && cy > b.top && cy < b.bottom) { res.dragMs = now() - t0; stepScroll(); }
        else { res.dragMisses++; token.style.transform = ''; }
      };
      token.addEventListener('pointerup', drop); token.addEventListener('pointercancel', () => { drag = null; token.style.transform = ''; });
      task.append(h('p', null, '2 of 3 · Drag the square into the box.'), pad);
    };
    const tap = h('button', { class: 'dot', id: 'warmTap', 'aria-label': 'Tap the circle', onclick: (e) => { res.tapMs = now() - t0; res.pointerType = res.pointerType || e.pointerType || null; stepDrag(); } });
    task.append(h('p', null, '1 of 3 · Tap the circle.'), h('div', { class: 'tapzone' }, tap));
    sheet(h('h1', null, 'Quick touch check'), h('p', { class: 'small' }, 'This checks that touch works on your phone. It is not part of the puzzle.'), task);
  };
  /** The one pairwise choice (S1) with its reason. */
  SHOW.pairwise = () => {
    const store                      = {}; const err = h('div', { class: 'err' });
    const order = listOrder(REC.pairSide);
    const btns = h('div', { class: 'row' });
    for (const a of order) {
      const b = h('button', { class: 'choice half', type: 'button', 'data-arm': a, onclick: () => { store.choice = a; [...btns.children].forEach((x) => x.classList.toggle('sel', x === b)); ev('pairTap', a); } },
        h('span', null, h('b', null, armLabel(a)), h('br'), h('span', { class: 'small' }, ARM[a].card)));
      btns.append(b);
    }
    sheet(
      h('h1', null, 'Which would you rather keep playing?'),
      h('div', { class: 'card pair' }, btns),
      textQ('why', 'In a few words, why?', store, true),
      err,
      h('button', { class: 'primary', style: 'width:100%', onclick: () => {
        if (!store.choice) { err.textContent = 'Please choose one.'; return; }
        if (!validText(store.why)) { err.textContent = 'Please write a few words.'; return; }
        REC.pairwise = { choice: store.choice, why: store.why, display: order.join(''), at: now() }; ev('pairwise', store.choice); next();
      } }, 'Next')
    );
  };
  SHOW.meaning = () => {
    const store                      = {}; const err = h('div', { class: 'err' });
    sheet(
      h('h1', null, 'One last question'),
      textQ('meaning', 'What is this game, in one sentence, as you would tell a friend?', store, true),
      err,
      h('button', { class: 'primary', style: 'width:100%', onclick: () => {
        if (!validText(store.meaning)) { err.textContent = 'Please write one sentence.'; return; }
        REC.meaning = { text: store.meaning, at: now() }; ev('meaning'); next();
      } }, 'Next')
    );
  };
  SHOW.complete = () => {
    if (!REC.completed) { REC.completed = true; ev('complete'); }
    if (!REC.g3) REC.g3 = { offeredAt: now(), choice: null, display: listOrder(REC.optList).join('') };
    // a reload during the optional board returns to it
    if (REC.g3.choice && REC.g3.choice !== 'stop' && REC.g3.sceneEnd == null && REC.cur && REC.cur.g3) { startG3Scene(REC.g3.choice); return; }
    save();
    const done = REC.g3.choice;
    if (done) { exitScreen(); return; }
    const code = h('div', { class: 'card', style: 'font-size:18px' }, 'Completion code: ', ...(U.HOSTED ? U.HOSTED.codeParts() : [h('b', null, 'TEST-ONLY'), h('div', { class: 'small' }, 'Review build: no real code; nothing is sent.')]));
    const kids = [h('h1', null, 'The study is complete. Thank you!'), code];
    kids.push(
      h('h2', null, 'Optional'),
      h('p', null, 'If you would like, play one more fresh board (about a minute). Your payment is the same whatever you choose.'),
      ...listOrder(REC.optList).map((a) => h('button', { class: 'choice', type: 'button', 'data-g3': a, onclick: () => g3Choose(a) },
        h('span', null, h('b', null, armLabel(a) + ' board'), h('br'), h('span', { class: 'small' }, ARM[a].card)))),
      h('button', { style: 'width:100%;margin-top:6px', 'data-g3': 'stop', onclick: () => g3Choose('stop') }, 'No thanks — finish')
    );
    if (DEV) kids.push(devRecordPanel());
    const sh = sheet(...kids); sh.classList.add('done');
    // which offer buttons were fully on screen at any time before the choice (scrolling counts)
    const seen = new Set(REC.g3.seen || []);
    const btns = [...document.querySelectorAll('[data-g3]')];
    const full = (b) => { const r = b.getBoundingClientRect(); return r.top >= 0 && r.left >= 0 && r.bottom <= innerHeight && r.right <= innerWidth; };
    const mark = () => { REC.g3.seen = [...seen].sort(); REC.g3.fullListSeen = seen.size === btns.length; };
    btns.forEach((b) => { if (full(b)) seen.add(b.getAttribute('data-g3')); });
    REC.g3.offerShown = (REC.g3.offerShown || []).concat([[now(), btns.every(full) ? 'allOnScreen' : 'notAllOnScreen', innerWidth, innerHeight]]);
    mark();
    try {
      offerWatch = new IntersectionObserver((entries) => { for (const e of entries) if (e.intersectionRatio >= 0.99) seen.add(e.target.getAttribute('data-g3')); mark(); }, { threshold: [0.99] });
      btns.forEach((b) => offerWatch.observe(b));
    } catch (e) { /* no observer: the first view above is what is recorded */ }
    save();
  };
  let offerWatch = null;
  function g3Choose(c) {
    if (offerWatch) { offerWatch.disconnect(); offerWatch = null; }
    REC.g3.choice = c; REC.g3.at = now(); REC.g3.decisionMs = REC.g3.at - REC.g3.offeredAt;
    const seen = new Set(REC.g3.seen || []); seen.add(c);
    REC.g3.seen = [...seen].sort(); REC.g3.fullListSeen = seen.size === document.querySelectorAll('[data-g3]').length;
    REC.g3.fullListSeenAtChoice = REC.g3.fullListSeen;
    ev('g3', c);
    if (c === 'stop') { exitScreen(); return; }
    startG3Scene(c);
  }
  /** After the optional choice: the continuation question when a board was played, then one short optional exit explanation, then Finish. */
  function exitScreen() {
    const g = REC.g3; const c = g.choice; const played = c && c !== 'stop';
    const store                      = { cont: g.cont || null };
    const err = h('div', { class: 'err' });
    const kids        = [h('h1', null, played ? 'Thanks for playing' : 'Nearly done')];
    if (played) {
      const yes = h('button', { class: 'choice half', type: 'button', 'data-cont': 'yes', onclick: () => pick('yes') }, 'Yes');
      const no = h('button', { class: 'choice half', type: 'button', 'data-cont': 'no', onclick: () => pick('no') }, 'No');
      const pick = (v) => { store.cont = v; yes.classList.toggle('sel', v === 'yes'); no.classList.toggle('sel', v === 'no'); ev('contTap', v); };
      kids.push(h('div', { class: 'card' }, h('div', null, 'Would you like to play another board like this one?'), h('div', { class: 'row' }, yes, no)));
    }
    kids.push(textQ('exitWhy', played ? 'In a few words, why did you choose the ' + armLabel(c).toLowerCase() + ' board?' : 'In a few words, why did you choose to finish?', store, false));
    kids.push(err, h('button', { class: 'primary', style: 'width:100%', onclick: () => {
      if (played && !store.cont) { err.textContent = 'Please answer the first question.'; return; }
      g.cont = store.cont; g.exitWhy = validText(store.exitWhy) ? store.exitWhy : ''; g.flowDone = true; ev('exit', [g.cont || '', g.exitWhy ? 1 : 0]);
      finish();
    } }, 'Finish'));
    if (DEV) kids.push(devRecordPanel());
    sheet(...kids);
    save();
  }
  function startG3Scene(armKey) {
    teardownScene();
    startScene({ kind: 'scene', arm: armKey, scene: DATA.optional + armKey, block: 3, idx: 0, g3: true }, () => { SHOW.complete(); });
  }
  function finish() {
    if (REC.finishedAt == null) { ev('finish'); REC.finishedAt = now(); }
    freezeRecord();
    allDone();
  }
  function allDone() {
    const kids = [h('h1', null, 'All done.'), h('p', null, 'You can close this page now.'), ...(U.HOSTED ? U.HOSTED.doneParts() : [])];
    if (DEV) kids.push(devRecordPanel());
    sheet(...kids);
  }
  function devRecordPanel() {
    const json = JSON.stringify(REC);
    const pre = h('pre', { class: 'rec', id: 'rec' }, json.slice(0, 4000) + (json.length > 4000 ? '…' : ''));
    const a = h('a', { href: 'data:application/json;charset=utf-8,' + encodeURIComponent(json), download: 'fl2b-record-' + (REC.slot || 'free') + '.json' }, 'Download session record');
    return h('div', { class: 'card' }, h('div', { class: 'small' }, 'Owner/test view only: session record (' + json.length + ' bytes). Nothing was sent.'), a, pre);
  }

  /* ------------------------------------------------------------------ rule diagrams */
  function ruleSvg(kind) {
    const s = 26, cells = [];
    const sq = (x        , y        , fill        , extra         ) => cells.push(`<rect x="${x * s + 2}" y="${y * s + 2}" width="${s - 4}" height="${s - 4}" rx="5" fill="${fill}" ${extra || ''}/>`);
    const fire = (x, y) => cells.push(`<circle cx="${x * s + s / 2}" cy="${y * s + s / 2}" r="${s / 2 - 3}" fill="#f06a1d"/><circle cx="${x * s + s / 2}" cy="${y * s + s / 2 + 2}" r="${s / 5}" fill="#ffd43b"/>`);
    const home = (x, y, warm) => cells.push(`<path d="M${x * s + 4} ${y * s + s / 2} L${x * s + s / 2} ${y * s + 4} L${x * s + s - 4} ${y * s + s / 2} V${y * s + s - 4} H${x * s + 4} Z" fill="${warm ? '#9a6b2f' : '#5c6b78'}"/><rect x="${x * s + s / 2 - 4}" y="${y * s + s / 2 + 1}" width="8" height="7" fill="${warm ? '#ffd43b' : '#3a4550'}"/>`);
    let wpx = 5;
    if (kind === 1) { fire(0, 0); sq(1, 0, '#f08c3a'); sq(2, 0, '#f08c3a'); sq(3, 0, '#f08c3a'); sq(4, 0, '#b08968'); wpx = 5; }
    if (kind === 2) { fire(0, 0); sq(1, 0, '#f08c3a'); sq(2, 0, '#f08c3a'); home(3, 0, true); wpx = 4; }
    if (kind === 3) { fire(0, 1); sq(1, 1, '#f08c3a'); sq(2, 0, '#b08968', 'stroke="#c2410c" stroke-dasharray="3 2"'); home(3, 0, false); wpx = 4; }
    const hh = kind === 3 ? 2 : 1;
    const svg = `<svg class="ruleimg" width="${wpx * s}" height="${hh * s}" viewBox="0 0 ${wpx * s} ${hh * s}" aria-hidden="true">${cells.join('')}</svg>`;
    return h('div', { html: svg });
  }

  SHOW.scene = (st) => startScene(st, () => next());
  SHOW.probe = (st) => startScene(st, () => next());
  /* ------------------------------------------------------------------ owner landing (review build) */
  function deviceLine() {
    const d = REC.device;
    const os = /^Android/.test(d.os) ? (d.platform === 'Android' && d.platformVersion ? 'Android ' + String(d.platformVersion).split('.')[0] : 'Android (version not reported to the page)') : d.os;
    return 'This device: ' + os + ' · ' + d.browser + ' · ' + d.vw + '×' + d.vh + ' at ' + (+d.dpr).toFixed(2) + ' · touch ' + (d.touch ? 'yes' : 'no') + ' · reduced motion ' + (REDUCED ? 'on' : 'off') + ' · sound: one tone per home, mutable'
      + ' · progress kept ' + (STORE.kind === 'session' ? 'in session storage' : STORE.kind === 'local' ? 'in local storage' : 'in this tab only (storage refused)');
  }
  function landing() {
    if (U.HOSTED) { invalidLink(); return; } // hosted: never the owner landing, free play or self-test
    const list = h('div', { class: 'list' });
    for (const a of DATA.assignment) {
      list.append(h('button', { 'data-slot': a.slot, onclick: () => { if (!TEST) { try { history.replaceState(null, '', '?slot=' + a.slot); } catch (e) { /* file: or sandbox may refuse; resume then needs ?slot= */ } } start(a); } }, h('b', null, a.slot), '  order ' + a.order + '  ', h('span', { class: 'small' }, '(pairwise first ' + a.pairFirst + ', offer first ' + a.optFirst + ')')));
    }
    const free = h('div', { class: 'list' });
    for (const sid of Object.keys(DATA.scenes).filter((k) => DATA.scenes[k].kind !== 'probe')) {
      const d = DATA.scenes[sid];
      free.append(h('button', { 'data-free': sid, onclick: () => { REC.slot = 'free'; REC.order = REC.order || 'BS'; startScene({ kind: 'scene', arm: d.arm, scene: sid, block: 9, idx: 0 }, landing); } }, (d.arm === 'S' ? 'STAKES' : 'BUDGET') + ' — ' + sid + ' (' + d.kind + (d.sym === 'r2' ? ', rotated' : '') + ')'));
    }
    for (const sid of DATA.probes) free.append(h('button', { 'data-free': sid, onclick: () => { REC.slot = 'free'; startScene({ kind: 'probe', arm: DATA.scenes[sid].arm, scene: sid, block: 9, idx: DATA.probes.indexOf(sid) }, landing); } }, 'Quick puzzle — ' + sid));
    const prev = RESUME ? storedSession() : null;
    const pa = prev && prev.rec && prev.rec.slot && prev.rec.finishedAt == null && !(prev.rec.consent && prev.rec.consent.declined) ? DATA.assignment.find((x) => x.slot === prev.rec.slot) : null;
    const resumeBtn = pa ? h('button', { class: 'primary', id: 'resumeSlot', style: 'width:100%', onclick: () => resumeSession(pa, prev) }, 'Resume test slot ' + pa.slot + ' (in progress in this tab)') : null;
    const out = h('div', { class: 'small', id: 'selftestOut' });
    const self = h('button', { id: 'selftest', style: 'width:100%', onclick: () => { const r = runSelfTest(); out.textContent = r.text; ev('selftest', [r.pass, r.total]); } }, 'Run the replay self-test');
    sheet(
      h('h1', null, 'FL-2B review build — owner and reviewer copy'),
      h('p', { class: 'small' }, 'Not a participant link: nothing is recorded outside this page and nothing is sent anywhere. Build ' + BUILD.id + ', scenes ' + String(DATA.scenesHash).slice(0, 12) + '.'),
      h('p', { class: 'small', id: 'deviceLine' }, deviceLine()),
      ...(resumeBtn ? [resumeBtn] : []),
      h('h2', null, 'Phone check: replay and state hash'), self, out,
      h('h2', null, 'Play a full session as a test slot'), list,
      h('h2', null, 'Free play: any board'), free
    );
  }
  /** Replays the built-in input logs on this device and compares the state and log hashes with Node's (phone check). */
  function runSelfTest() {
    const st = DATA.selftest || { vectors: [], sha: [] };
    let pass = 0; const lines           = [];
    for (const v of st.vectors) {
      const def = DATA.scenes[v.sid]; const sc = FLE.parseScene(def);
      const rr = FLM.replayLog(sc, v.cond, v.sid, DATA.hashes[v.sid], def.laid || [], v.log);
      const got = rr.error ? 'error' : FLM.stateHash(rr.board);
      const ok = !rr.error && got === v.stateHash && FLM.logHash(v.log) === v.logHash;
      if (ok) pass++;
      lines.push(v.sid + ' ' + v.cond + ' (' + v.log.length + ' actions): ' + (ok ? 'same hash ' : 'DIFFERENT ') + String(got).slice(0, 12));
    }
    let shaOk = 0; for (const [txt, want] of st.sha) if (W.FLHash.sha256Hex(txt) === want) shaOk++;
    const total = st.vectors.length;
    const text = (pass === total && shaOk === st.sha.length ? 'PASS: ' : 'FAIL: ') + pass + ' of ' + total + ' input logs reproduce their state hash; SHA-256 known answers ' + shaOk + ' of ' + st.sha.length + '. ' + lines.join('; ') + '.';
    return { pass, total, shaOk, text };
  }
  function invalidLink() {
    ev('invalidLink');
    sheet(h('h1', null, 'This link is not valid.'), h('p', null, 'Please go back to the study page and use the link you were given.'));
  }

  /* ------------------------------------------------------------------ boot */
  function boot() {
    if (REDUCED) document.documentElement.classList.add('reduce');
    if (U.HOSTED) { const g = U.HOSTED.admit(); if (g === 'nocred') { invalidLink(); return; } if (g === 'declined') { U.FROZEN = true; declinedScreen(); return; } if (g !== 'ok') return; } // hosted: the Chrome gate and the invitation first
    const want = QS.get('slot');
    if (want === null) { landing(); return; }
    const a = DATA.assignment.find((x) => x.slot === want);
    if (!a) { invalidLink(); return; } // never show the owner landing to a mistyped participant link
    const resumed = storedSession();
    if (RESUME && resumed && resumed.slot === want && resumed.rec && resumed.rec.slot === want) { resumeSession(a, resumed); return; }
    start(a);
  }
  /** Continue the same session: same time base, same record, same step (a running board is restored). */
  function resumeSession(a, resumed) {
    Object.assign(REC, resumed.rec);
    U.T0 = REC.t0 || Date.parse(REC.startedAt) || U.T0;
    REC.resumes = (REC.resumes || []).concat([now()]);
    setSlot(a); U.FLOW = buildFlow(a);
    ev('resume', resumed.stepIdx);
    if (REC.finishedAt != null) { U.FROZEN = true; U.stepIdx = U.FLOW.length - 1; allDone(); return; } // a finished session is never restarted or rewritten
    if (REC.consent && REC.consent.declined) { U.FROZEN = true; declinedScreen(); return; }
    go(Math.min(resumed.stepIdx, U.FLOW.length - 1), true);
  }

  Object.assign(U, { start, go, deviceLine, CONSENT_VERSION });
  boot();
})();
</script>
